const fmtTime = s => `${Math.floor(s / 60)}분 ${String(s % 60).padStart(2, '0')}초`;

/* ---- 태그별 집계 ---- */
function tagAgg(queue, answers) {
  const agg = {};
  queue.filter(isAuto).forEach(q => {
    const sc = answers[q.id]?.score || 0;
    q.tags.forEach(t => {
      agg[t] = agg[t] || { got: 0, max: 0 };
      agg[t].got += sc; agg[t].max += q.maxScore;
    });
  });
  return agg;
}

function renderTagProfile(queue, answers) {
  const agg = tagAgg(queue, answers);
  const rows = Object.entries(agg).filter(([, v]) => v.max > 0)
    .sort((a, b) => (a[1].got / a[1].max) - (b[1].got / b[1].max));
  if (!rows.length) return '';
  return `<div style="margin-bottom:18px">
    <span class="eyebrow" style="display:block;margin-bottom:6px">역량 태그별 획득률</span>
    ${rows.map(([t, v]) => {
      const pc = Math.round(v.got / v.max * 100);
      const col = pc >= 85 ? 'var(--s3)' : pc >= 60 ? 'var(--s2)' : pc >= 35 ? 'var(--s1)' : 'var(--s0)';
      return `<div class="tagrow">
        <span class="nm">${esc(t)}</span>
        <span class="tr"><i style="width:${pc}%;background:${col}"></i></span>
        <span class="pc mono">${pc}%</span></div>`;
    }).join('')}
  </div>`;
}


/* ============================================================================
   성찰 단원 — 채점 없음. 쓰고, 모아보고, 다시 쓰는 흐름
   ========================================================================== */
let REF = null;   // { unitId, round, i, drafts:{qid:text} }

function renderReflectPanel(unitId) {
  const u = BANK.units.find(x => x.id === unitId);
  const qs = reflectQs(unitId);
  const written = reflectWritten(unitId);
  const round = reflectRound(unitId);
  const sent = S.sent[unitId];
  const partial = written > 0 && written < qs.length;

  const rows = qs.map((q, i) => {
    const drafts = S.reflect[q.id] || [];
    const last = drafts[drafts.length - 1];
    const state = !drafts.length ? '<span class="rstate none">미작성</span>'
      : `<span class="rstate done">${drafts.length}차 · ${last.text.trim().length}자</span>`;
    return `<div class="rrow">
      <span class="rnum mono">${i + 1}</span>
      <div class="rq">${esc(q.prompt)}</div>
      ${state}
    </div>`;
  }).join('');

  let cta;
  if (sent) {
    cta = `<button class="btn quiet" id="refView">제출한 내용 보기</button>`;
  } else if (round === 0) {
    cta = `<button class="btn unit" id="refStart">${partial ? '이어서 쓰기' : '쓰기 시작'}</button>`;
  } else {
    cta = `<button class="btn unit" id="refReview">모아보기</button>
           <button class="btn quiet" id="refAgain" style="margin-top:8px">${round + 1}차로 다시 쓰기</button>`;
  }

  $('#stage').innerHTML = `
    <div class="panel unit-panel" style="--u:${esc(u.color || '#5F7A1E')}">
      <div class="unit-head">
        <span class="big-ic">${esc(u.icon || '✍️')}</span>
        <div>
          <span class="eyebrow tinted">${esc(u.title)} · ${qs.length}문항</span>
          <h2>${esc(u.subtitle || '')}</h2>
          <p>맞고 틀림이 없습니다. 점수도 매기지 않습니다.</p>
        </div>
      </div>
      ${u.note ? `<div class="notice unit-note" style="margin-top:14px">${esc(u.note)}</div>` : ''}

      <div class="rlist">${rows}</div>

      ${round >= 2 ? `<div class="notice good" style="margin-top:14px">
        <b>${round}차까지 썼습니다.</b> 모아보기에서 회차별 답을 나란히 볼 수 있어요.</div>` : ''}
      ${sent ? `<div class="notice" style="margin-top:14px">제출 ${esc(String(sent).slice(0, 16).replace('T', ' '))} · 수정할 수 없습니다.</div>` : ''}

      <div class="foot" style="flex-direction:column;align-items:stretch">${cta}</div>
    </div>`;

  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
  on('#refStart', () => startReflect(unitId, 1));
  on('#refAgain', () => {
    if (confirm(`${round + 1}차로 다시 씁니다. 이전에 쓴 답은 그대로 보관돼요.`))
      startReflect(unitId, round + 1);
  });
  on('#refReview', () => reviewReflect(unitId));
  on('#refView', () => reviewReflect(unitId));
}

function startReflect(unitId, round) {
  const qs = reflectQs(unitId);
  // 미완성 회차라면 이어서. 아직 안 쓴 첫 문항으로 이동
  const drafts = {};
  qs.forEach(q => {
    const list = S.reflect[q.id] || [];
    if (list.length >= round) drafts[q.id] = list[round - 1].text;
  });
  let start = qs.findIndex(q => drafts[q.id] === undefined);
  if (start < 0) start = 0;
  REF = { unitId, round, i: start, drafts };
  renderReflectWrite();
}

function renderReflectWrite() {
  const { unitId, round, i, drafts } = REF;
  const u = BANK.units.find(x => x.id === unitId);
  const qs = reflectQs(unitId);
  const q = qs[i];
  const prev = (S.reflect[q.id] || []).slice(0, round - 1);
  const cur = drafts[q.id] || '';

  $('#stage').innerHTML = `
    <div class="runner" style="--u:${esc(u.color || '#5F7A1E')}">
      <div class="runner-bar">
        <span class="mode-tag prac">${round}차 작성</span>
        <span class="pos mono">${i + 1} / ${qs.length}</span>
        <span class="spacer"></span>
        <button class="ghost-btn" style="border-color:var(--line-2);color:var(--muted)" id="refExit">저장하고 나가기</button>
      </div>
      <div class="runner-body">
        <span class="eyebrow tinted">정답 없음 · 채점 없음</span>
        <p class="q-prompt" style="margin-top:8px">${esc(q.prompt)}</p>
        ${q.context ? `<div class="q-context">${nl2br(q.context)}</div>` : ''}

        ${q.think && q.think.length ? `<div class="think">
          <span class="eyebrow">생각해볼 것</span>
          <ul>${q.think.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
        </div>` : ''}

        ${prev.length ? prev.map((d, n) => `<details class="prev" ${n === prev.length - 1 ? 'open' : ''}>
          <summary>${n + 1}차에 쓴 답 <span class="dim mono">${d.text.trim().length}자</span></summary>
          <div class="prevbody">${esc(d.text)}</div>
        </details>`).join('') : ''}

        <textarea class="free-input" id="refIn" placeholder="${esc(q.placeholder)}">${esc(cur)}</textarea>
        <div class="counter mono" id="refCnt">0자</div>

        <div class="foot">
          ${i > 0 ? '<button class="btn quiet sm" id="refPrev" style="margin-top:0">이전</button>' : ''}
          <span class="spacer"></span>
          <button class="btn sm unit" id="refNext" style="margin-top:0">
            ${i === qs.length - 1 ? '모아보기' : '다음 질문'}
          </button>
        </div>
      </div>
    </div>`;

  const ta = $('#refIn');
  const count = () => { $('#refCnt').textContent = ta.value.trim().length + '자'; };
  ta.addEventListener('input', count); count();
  ta.focus();

  const stash = () => { REF.drafts[q.id] = ta.value; };
  const commit = () => {
    stash();
    const text = (REF.drafts[q.id] || '').trim();
    if (!text) return;
    const list = S.reflect[q.id] || (S.reflect[q.id] = []);
    const rec = { text, at: new Date().toISOString() };
    if (list.length >= round) list[round - 1] = rec; else list.push(rec);
    bumpStreak(); saveState(); renderStats(); renderUnitList();
  };

  $('#refExit').addEventListener('click', () => { commit(); openUnit(unitId); });
  const pv = $('#refPrev');
  if (pv) pv.addEventListener('click', () => { commit(); REF.i--; renderReflectWrite(); });
  $('#refNext').addEventListener('click', () => {
    commit();
    if (REF.i === qs.length - 1) reviewReflect(unitId);
    else { REF.i++; renderReflectWrite(); }
  });
}

function reviewReflect(unitId) {
  const u = BANK.units.find(x => x.id === unitId);
  const qs = reflectQs(unitId);
  const round = reflectRound(unitId);
  const missing = qs.filter(q => !(S.reflect[q.id] || []).length);
  const sent = S.sent[unitId];

  const cards = qs.map((q, i) => {
    const drafts = S.reflect[q.id] || [];
    if (!drafts.length) {
      return `<div class="rcard empty-card">
        <span class="rnum mono">${i + 1}</span>
        <div class="rcbody"><div class="rcq">${esc(q.prompt)}</div>
        <p class="rcnone">아직 쓰지 않았습니다.</p></div></div>`;
    }
    const last = drafts[drafts.length - 1];
    const older = drafts.slice(0, -1);
    return `<div class="rcard">
      <span class="rnum mono">${i + 1}</span>
      <div class="rcbody">
        <div class="rcq">${esc(q.prompt)}</div>
        ${q.context ? `<div class="q-context" style="margin-bottom:10px">${nl2br(q.context)}</div>` : ''}
        <div class="rclatest">
          <span class="eyebrow tinted">${drafts.length}차 · ${last.text.trim().length}자</span>
          <div class="rctext">${esc(last.text)}</div>
        </div>
        ${older.map((d, n) => `<details class="prev">
          <summary>${n + 1}차에 쓴 답과 비교 <span class="dim mono">${d.text.trim().length}자</span></summary>
          <div class="prevbody">${esc(d.text)}</div>
        </details>`).join('')}
      </div>
    </div>`;
  }).join('');

  $('#stage').innerHTML = `
    <div class="panel unit-panel" style="--u:${esc(u.color || '#5F7A1E')}">
      <span class="eyebrow tinted">모아보기 · ${esc(u.title)}</span>
      <h2 style="font-size:24px;font-weight:800;letter-spacing:-.035em;margin:3px 0 6px">
        지금까지 쓴 답</h2>
      <p style="color:var(--muted);font-size:14.5px;margin:0 0 18px">
        ${round >= 2
          ? '회차를 펼쳐 이전 답과 비교해 보세요. 무엇이 달라졌는지가 이 과정의 결과입니다.'
          : '한 번 훑어보고, 다른 단원을 마친 뒤 돌아와 다시 써보세요.'}</p>

      ${missing.length ? `<div class="notice warn" style="margin-bottom:16px">
        <b>아직 ${missing.length}개를 쓰지 않았습니다.</b> 네 질문을 모두 써야 제출할 수 있어요.</div>` : ''}

      <div class="rcards">${cards}</div>

      <div class="foot" style="flex-wrap:wrap;gap:8px">
        <button class="btn quiet sm" id="refBack" style="margin-top:0">단원으로</button>
        <span class="spacer"></span>
        ${sent ? '<span class="note">제출 완료 · 수정할 수 없습니다</span>' : `
          <button class="btn quiet sm" id="refMore" style="margin-top:0">${round + 1}차로 다시 쓰기</button>
          <button class="btn sm unit" id="refSend" style="margin-top:0" ${missing.length ? 'disabled' : ''}>제출하기</button>`}
      </div>
      ${sent ? '' : '<p class="note" style="margin:10px 0 0">제출하면 더 이상 고칠 수 없습니다. 충분히 다시 써본 뒤에 누르세요.</p>'}
    </div>`;

  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
  on('#refBack', () => openUnit(unitId));
  on('#refMore', () => {
    if (confirm(`${round + 1}차로 다시 씁니다. 이전 답은 그대로 보관돼요.`))
      startReflect(unitId, round + 1);
  });
  on('#refSend', () => sendReflect(unitId));
}

async function sendReflect(unitId) {
  const qs = reflectQs(unitId);
  if (!confirm('제출하면 수정할 수 없습니다. 제출할까요?')) return;

  const u = BANK.units.find(x => x.id === unitId);
  const payload = {
    unit: unitId, unitTitle: u.title, bankVersion: BANK.version,
    submittedAt: new Date().toISOString(), elapsedSec: 0,
    auto: { got: 0, max: 0 }, manualCount: qs.length, tagScores: {},
    items: qs.map(q => {
      const drafts = S.reflect[q.id] || [];
      return {
        id: q.id, type: 'reflect', tags: q.tags, maxScore: 0, answered: !!drafts.length,
        choice: null, value: null, score: null,
        text: drafts.map((d, n) => `[${n + 1}차 · ${d.at.slice(0, 10)}]\n${d.text}`).join('\n\n')
      };
    })
  };

  $('#stage').innerHTML = `<div class="panel"><div class="empty">
    <span class="ic">⏳</span><p>제출하고 있어요</p></div></div>`;

  let via = 'local';
  try { via = (await submitCheck(unitId, payload)).via; }
  catch (e) {
    $('#stage').innerHTML = `
      <div class="panel">
        <div class="notice bad"><b>제출에 실패했습니다.</b> ${esc(e.message)}</div>
        <div class="notice" style="margin-top:10px">쓴 내용은 그대로 남아 있습니다. 아래 버튼으로 파일을 내려 담당자에게 전달해 주세요.</div>
        <div class="foot"><button class="btn sm" id="dl" style="margin-top:0">파일로 내려받기</button>
        <span class="spacer"></span><button class="btn quiet sm" id="bk" style="margin-top:0">돌아가기</button></div>
      </div>`;
    $('#dl').addEventListener('click', async () => {
      const keep = CONFIG.SYNC_URL; CONFIG.SYNC_URL = '';
      await submitCheck(unitId, payload); CONFIG.SYNC_URL = keep;
      toast('파일을 내려받았습니다');
    });
    $('#bk').addEventListener('click', () => reviewReflect(unitId));
    return;
  }

  S.sent[unitId] = payload.submittedAt;
  S.check[unitId] = payload;
  saveState(); renderStats(); renderUnitList();

  $('#stage').innerHTML = `
    <div class="panel done-wrap unit-panel" style="--u:${esc(u.color || '#5F7A1E')}">
      <span class="eyebrow tinted">제출 완료 · ${esc(u.title)}</span>
      <h2>제출됐습니다</h2>
      <p class="lead">쓴 답은 회차별로 함께 전달됩니다. 면접에서 이 내용을 놓고 이야기합니다.</p>
      ${via === 'download'
        ? '<div class="notice warn"><b>서버가 연결되지 않아 파일로 내려받았습니다.</b> 담당자에게 전달해 주세요.</div>'
        : '<div class="notice good">답변이 서버에 기록됐습니다.</div>'}
      <div class="foot"><span class="spacer"></span>
        <button class="btn sm" id="done" style="margin-top:0">단원 목록으로</button></div>
    </div>`;
  $('#done').addEventListener('click', () => openUnit(unitId));
}


/* ============================================================================
   내 지표 계산 — 공식 보고 내 숫자를 넣어 기록. 채점 없음, 여러 번 수정 가능
   ========================================================================== */
let WRK = null;   // { unitId, i }

const fmtPct = v => v === null ? '—' : (Math.round(v * 10) / 10).toFixed(1) + '%';

function renderWorkPanel(unitId) {
  const u = BANK.units.find(x => x.id === unitId);
  const qs = workQs(unitId);
  const sent = S.sent[unitId];
  const written = workWritten(unitId);

  const rows = qs.map((q, i) => {
    const recs = S.work[q.id] || [];
    const last = recs[recs.length - 1];
    return `<div class="rrow">
      <span class="rnum mono">${i + 1}</span>
      <div class="rq">${esc(q.prompt)}
        <div class="wformula mono">${esc(q.formula)}</div>
      </div>
      ${last
        ? `<span class="wval mono">${fmtPct(last.value)}<span class="wround">${recs.length}차</span></span>`
        : '<span class="rstate none">미기록</span>'}
    </div>`;
  }).join('');

  $('#stage').innerHTML = `
    <div class="panel unit-panel" style="--u:${esc(u.color || '#96341F')}">
      <div class="unit-head">
        <span class="big-ic">${esc(u.icon || '🧮')}</span>
        <div>
          <span class="eyebrow tinted">${esc(u.title)} · ${qs.length}개 지표</span>
          <h2>${esc(u.subtitle || '')}</h2>
          <p>공식은 화면에 있습니다. 내 시트에서 숫자만 옮겨 적으면 됩니다.</p>
        </div>
      </div>
      ${u.note ? `<div class="notice unit-note" style="margin-top:14px">${esc(u.note)}</div>` : ''}

      <div class="rlist">${rows}</div>

      ${sent ? `<div class="notice" style="margin-top:14px">제출 ${esc(String(sent).slice(0, 16).replace('T', ' '))} · 수정할 수 없습니다.</div>` : ''}

      <div class="foot" style="flex-direction:column;align-items:stretch">
        ${sent
          ? '<button class="btn quiet" id="wkView">제출한 기록 보기</button>'
          : `<button class="btn unit" id="wkStart">${written ? '이어서 기록하기' : '기록 시작'}</button>
             ${written ? '<button class="btn quiet" id="wkReview" style="margin-top:8px">모아보기</button>' : ''}`}
      </div>
    </div>`;

  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
  on('#wkStart', () => { WRK = { unitId, i: 0 }; renderWorkEntry(); });
  on('#wkReview', () => reviewWork(unitId));
  on('#wkView', () => reviewWork(unitId));
}

function renderWorkEntry() {
  const { unitId, i } = WRK;
  const u = BANK.units.find(x => x.id === unitId);
  const qs = workQs(unitId);
  const q = qs[i];
  const recs = S.work[q.id] || [];
  const last = recs[recs.length - 1];

  $('#stage').innerHTML = `
    <div class="runner" style="--u:${esc(u.color || '#96341F')}">
      <div class="runner-bar">
        <span class="mode-tag prac">계산 기록</span>
        <span class="pos mono">${i + 1} / ${qs.length}</span>
        <span class="spacer"></span>
        <button class="ghost-btn" style="border-color:var(--line-2);color:var(--muted)" id="wkExit">나가기</button>
      </div>
      <div class="runner-body">
        <span class="eyebrow tinted">채점 없음 · 여러 번 고쳐 쓸 수 있어요</span>
        <p class="q-prompt" style="margin-top:8px">${esc(q.prompt)}</p>

        <div class="wcalc">
          <span class="eyebrow">계산 공식</span>
          <div class="wcalc-f mono">${esc(q.formula)}</div>
          ${q.watch ? `<div class="wcalc-w">${esc(q.watch)}</div>` : ''}
        </div>

        <div class="winputs">
          ${q.inputs.map(f => `
            <label class="wfield">
              <span class="wlabel">${esc(f.label)}</span>
              ${f.hint ? `<span class="whint">${esc(f.hint)}</span>` : ''}
              <input type="text" inputmode="decimal" data-k="${esc(f.key)}"
                     value="${last && last[f.key] !== undefined ? esc(last[f.key]) : ''}"
                     placeholder="숫자" autocomplete="off">
            </label>`).join('')}
        </div>

        <div class="wresult" id="wkOut">
          <span class="eyebrow">계산 결과</span>
          <div class="wbig mono" id="wkVal">—</div>
          <div class="wnote" id="wkHow"></div>
        </div>

        <div class="memo-block">
          <span class="eyebrow">${esc(q.memoLabel || '메모')}</span>
          <textarea class="free-input" id="wkMemo" style="min-height:130px"
            placeholder="${esc(q.memoHint || '')}">${last ? esc(last.memo || '') : ''}</textarea>
          <div class="counter mono" id="wkCnt">0자</div>
        </div>

        ${recs.length ? `<details class="prev" open>
          <summary>지난 기록 ${recs.length}건 보기</summary>
          <div class="prevbody">${recs.map((r, n) =>
            `<div class="wprev"><b>${n + 1}차</b> <span class="mono">${fmtPct(r.value)}</span>
             <span class="dim mono">${esc(String(r.at).slice(0, 10))}</span>
             ${r.memo ? `<div class="wprevmemo">${esc(r.memo)}</div>` : ''}</div>`).join('')}</div>
        </details>` : ''}

        <div class="foot">
          ${i > 0 ? '<button class="btn quiet sm" id="wkPrev" style="margin-top:0">이전</button>' : ''}
          <span class="spacer"></span>
          <button class="btn sm unit" id="wkNext" style="margin-top:0">
            ${i === qs.length - 1 ? '저장하고 모아보기' : '저장하고 다음'}
          </button>
        </div>
      </div>
    </div>`;

  const nums = () => {
    const out = {};
    document.querySelectorAll('.winputs input').forEach(el => {
      const v = parseFloat(String(el.value).replace(/,/g, '').trim());
      out[el.dataset.k] = isNaN(v) ? null : v;
    });
    return out;
  };
  const recompute = () => {
    const r = calcFrom(q, nums());
    $('#wkVal').textContent = fmtPct(r.value);
    $('#wkHow').textContent = r.expr ||
      `${q.inputs.length}개 숫자를 모두 넣으면 계산됩니다.`;
    return r.value;
  };
  document.querySelectorAll('.winputs input').forEach(el => el.addEventListener('input', recompute));
  recompute();

  const ta = $('#wkMemo');
  const count = () => { $('#wkCnt').textContent = ta.value.trim().length + '자'; };
  ta.addEventListener('input', count); count();

  const commit = () => {
    const n = nums();
    const r = calcFrom(q, n);
    if (r.value === null) return false;                  // 숫자가 덜 채워지면 기록하지 않음
    const list = S.work[q.id] || (S.work[q.id] = []);
    list.push(Object.assign({}, n, { value: r.value, memo: ta.value.trim(), at: new Date().toISOString() }));
    bumpStreak(); saveState(); renderStats(); renderUnitList();
    return true;
  };

  $('#wkExit').addEventListener('click', () => { commit(); openUnit(unitId); });
  const pv = $('#wkPrev');
  if (pv) pv.addEventListener('click', () => { commit(); WRK.i--; renderWorkEntry(); });
  $('#wkNext').addEventListener('click', () => {
    if (!commit()) { toast('숫자를 모두 넣어주세요'); return; }
    if (WRK.i === qs.length - 1) reviewWork(unitId);
    else { WRK.i++; renderWorkEntry(); }
  });
}

function reviewWork(unitId) {
  const u = BANK.units.find(x => x.id === unitId);
  const qs = workQs(unitId);
  const sent = S.sent[unitId];
  const missing = qs.filter(q => !(S.work[q.id] || []).length);

  // 연장률과 재수강률이 모두 기록됐으면 간격을 보여줍니다
  const ext = (S.work['ws-001'] || []).slice(-1)[0];
  const re = (S.work['ws-002'] || []).slice(-1)[0];
  const gapBox = (ext && re && ext.value !== null && re.value !== null)
    ? `<div class="notice good" style="margin-bottom:16px">
         <b>연장률 ${fmtPct(ext.value)} · 재수강률 ${fmtPct(re.value)}</b> —
         두 지표의 간격은 ${(Math.round((ext.value - re.value) * 10) / 10).toFixed(1)}%p 입니다.
         이 간격이 환불로 빠진 몫입니다.</div>`
    : '';

  const cards = qs.map((q, i) => {
    const recs = S.work[q.id] || [];
    if (!recs.length) {
      return `<div class="rcard empty-card"><span class="rnum mono">${i + 1}</span>
        <div class="rcbody"><div class="rcq">${esc(q.prompt)}</div>
        <p class="rcnone">아직 기록하지 않았습니다.</p></div></div>`;
    }
    const last = recs[recs.length - 1];
    const older = recs.slice(0, -1);
    return `<div class="rcard"><span class="rnum mono">${i + 1}</span>
      <div class="rcbody">
        <div class="rcq">${esc(q.prompt)}</div>
        <div class="wformula mono" style="margin-bottom:9px">${esc(q.formula)}</div>
        <div class="wsum">
          <span class="wbig mono">${fmtPct(last.value)}</span>
          <span class="wsum-x mono">${esc(exprOf(q, last))}</span>
          <span class="wround">${recs.length}차</span>
        </div>
        ${last.memo ? `<div class="rctext">${esc(last.memo)}</div>` : ''}
        ${older.length ? `<details class="prev">
          <summary>지난 기록 ${older.length}건과 비교</summary>
          <div class="prevbody">${older.map((r, n) =>
            `<div class="wprev"><b>${n + 1}차</b> <span class="mono">${fmtPct(r.value)}</span>
             <span class="dim mono">${esc(String(r.at).slice(0, 10))}</span>
             ${r.memo ? `<div class="wprevmemo">${esc(r.memo)}</div>` : ''}</div>`).join('')}</div>
        </details>` : ''}
      </div></div>`;
  }).join('');

  $('#stage').innerHTML = `
    <div class="panel unit-panel" style="--u:${esc(u.color || '#96341F')}">
      <span class="eyebrow tinted">모아보기 · ${esc(u.title)}</span>
      <h2 style="font-size:24px;font-weight:800;letter-spacing:-.035em;margin:3px 0 6px">내 지표 기록</h2>
      <p style="color:var(--muted);font-size:14.5px;margin:0 0 18px">
        숫자가 바뀌면 다시 기록하세요. 이전 기록은 지워지지 않고 함께 남습니다.</p>
      ${gapBox}
      ${missing.length ? `<div class="notice warn" style="margin-bottom:16px">
        <b>아직 ${missing.length}개를 기록하지 않았습니다.</b> 네 지표를 모두 기록해야 제출할 수 있어요.</div>` : ''}
      <div class="rcards">${cards}</div>
      <div class="foot" style="flex-wrap:wrap;gap:8px">
        <button class="btn quiet sm" id="wkBack" style="margin-top:0">단원으로</button>
        <span class="spacer"></span>
        ${sent ? '<span class="note">제출 완료 · 수정할 수 없습니다</span>' : `
          <button class="btn quiet sm" id="wkMore" style="margin-top:0">다시 기록하기</button>
          <button class="btn sm unit" id="wkSend" style="margin-top:0" ${missing.length ? 'disabled' : ''}>제출하기</button>`}
      </div>
      ${sent ? '' : '<p class="note" style="margin:10px 0 0">제출하면 더 이상 고칠 수 없습니다.</p>'}
    </div>`;

  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
  on('#wkBack', () => openUnit(unitId));
  on('#wkMore', () => { WRK = { unitId, i: 0 }; renderWorkEntry(); });
  on('#wkSend', () => sendWork(unitId));
}

async function sendWork(unitId) {
  const qs = workQs(unitId);
  if (!confirm('제출하면 수정할 수 없습니다. 제출할까요?')) return;
  const u = BANK.units.find(x => x.id === unitId);
  const payload = {
    unit: unitId, unitTitle: u.title, bankVersion: BANK.version,
    submittedAt: new Date().toISOString(), elapsedSec: 0,
    auto: { got: 0, max: 0 }, manualCount: qs.length, tagScores: {},
    items: qs.map(q => {
      const recs = S.work[q.id] || [];
      return {
        id: q.id, type: 'worksheet', tags: q.tags, maxScore: 0, answered: !!recs.length,
        choice: null, score: null,
        value: recs.length ? recs[recs.length - 1].value : null,
        text: recs.map((r, n) =>
          `[${n + 1}차 · ${String(r.at).slice(0, 10)}] ${fmtPct(r.value)}  ${exprOf(q, r)}`
          + (r.memo ? `\n${r.memo}` : '')).join('\n\n')
      };
    })
  };

  $('#stage').innerHTML = `<div class="panel"><div class="empty">
    <span class="ic">⏳</span><p>제출하고 있어요</p></div></div>`;

  let via = 'local';
  try { via = (await submitCheck(unitId, payload)).via; }
  catch (e) {
    $('#stage').innerHTML = `<div class="panel">
      <div class="notice bad"><b>제출에 실패했습니다.</b> ${esc(e.message)}</div>
      <div class="notice" style="margin-top:10px">기록은 그대로 남아 있습니다.</div>
      <div class="foot"><span class="spacer"></span>
        <button class="btn quiet sm" id="bk" style="margin-top:0">돌아가기</button></div></div>`;
    $('#bk').addEventListener('click', () => reviewWork(unitId));
    return;
  }
  S.sent[unitId] = payload.submittedAt;
  S.check[unitId] = payload;
  saveState(); renderStats(); renderUnitList();

  $('#stage').innerHTML = `
    <div class="panel done-wrap unit-panel" style="--u:${esc(u.color || '#96341F')}">
      <span class="eyebrow tinted">제출 완료 · ${esc(u.title)}</span>
      <h2>제출됐습니다</h2>
      <p class="lead">회차별 기록과 메모가 함께 전달됩니다.</p>
      ${via === 'download'
        ? '<div class="notice warn"><b>서버가 연결되지 않아 파일로 내려받았습니다.</b> 담당자에게 전달해 주세요.</div>'
        : '<div class="notice good">기록이 서버에 저장됐습니다.</div>'}
      <div class="foot"><span class="spacer"></span>
        <button class="btn sm" id="done" style="margin-top:0">단원 목록으로</button></div>
    </div>`;
  $('#done').addEventListener('click', () => openUnit(unitId));
}

/* ============================================================================
   10. 복습함
   ========================================================================== */
function openReview() {
  const qs = S.review.map(id => BANK.questions.find(q => q.id === id)).filter(Boolean);
  if (!qs.length) { toast('복습할 문항이 없습니다'); return; }
  CUR_UNIT = null; renderUnitList();
  $('#stage').innerHTML = `
    <div class="panel">
      <span class="eyebrow">복습함</span>
      <h2 style="font-size:22px;font-weight:800;letter-spacing:-.03em;margin:2px 0 6px">
        최선에 닿지 못한 ${qs.length}문항</h2>
      <p style="color:var(--muted);font-size:13px;margin:0 0 18px">
        틀린 문항만이 아니라, 차선을 고른 문항도 함께 담깁니다. 만점을 받으면 자동으로 빠져요.</p>
      <div class="unit-list">
        ${qs.map(q => {
          const r = S.practice[q.id];
          const s = Math.min(r ? r.best : 0, 3);
          return `<div class="unit-btn" style="cursor:default">
            <div class="row">
              <span class="score-chip sc-${s}" style="margin-top:0">${r ? r.best : 0}/${q.maxScore}</span>
              <span class="nm" style="font-weight:500;font-size:13px">${esc(q.prompt.slice(0, 70))}${q.prompt.length > 70 ? '…' : ''}</span>
            </div>
            <div class="sub">${TYPE_LABEL[q.type]} · ${esc(q.tags.join(', ') || '태그 없음')}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="foot">
        <span class="spacer"></span>
        <button class="btn sm" id="reviewRun" style="margin-top:0">${qs.length}문항 다시 풀기</button>
      </div>
    </div>`;
  $('#reviewRun').addEventListener('click', () => startRun(qs[0].unit, 'practice', qs));
}

/* ============================================================================
   11. 개발자 검증 패널  ( URL 에 ?dev=1 )
   ========================================================================== */
function renderDev() {
  const byUnit = BANK.units.map(u => {
    const p = qOfUnit(u.id, 'practice').length, c = qOfUnit(u.id, 'check').length;
    return `  ${u.id.padEnd(22)} 연습 ${String(p).padStart(3)}  체크 ${String(c).padStart(3)}`;
  }).join('\n');
  const orphan = BANK.questions.filter(q => !q.tags.length).map(q => q.id);
  $('#devPanel').classList.remove('hidden');
  $('#devPanel').innerHTML = `
    <div class="panel">
      <span class="eyebrow">문항 뱅크 검증 · version ${esc(BANK.version)}</span>
      <pre>단원 ${BANK.units.length}개 / 문항 ${BANK.questions.length}개
${byUnit}

스키마 오류 ${BANK_ERRORS.length}건${BANK_ERRORS.length ? '\n' + BANK_ERRORS.map(e => '  ✗ ' + e).join('\n') : ''}
태그 없는 문항 ${orphan.length}건${orphan.length ? '\n  ' + orphan.join(', ') : ''}
저장소 ${store.persistent ? 'localStorage 사용 가능' : '메모리 전용 — 새로고침 시 초기화'}
서버 ${CONFIG.SYNC_URL || '(미설정 · 제출은 파일 다운로드)'}
진단 ${diagnoseUrl(CONFIG.SYNC_URL) ? diagnoseUrl(CONFIG.SYNC_URL).replace(/<[^>]+>/g, '') : '주소 형태 정상'}
토큰 ${CONFIG.ACCESS_TOKEN ? '설정됨' : '미설정'}${SYNC_BLOCKED ? '\n거부 ' + SYNC_BLOCKED : ''}</pre>
      <div class="foot" style="margin-top:14px">
        <button class="btn quiet sm" id="pingBtn" style="margin-top:0">서버 연결 테스트</button>
        <span class="note mono" id="pingOut"></span>
      </div>
    </div>`;
  $('#pingBtn').addEventListener('click', testServer);
}

/* 배포한 Apps Script 웹앱이 실제로 응답하는지 3단계로 확인합니다 */
async function testServer() {
  const out = $('#pingOut');
  const bad = diagnoseUrl(CONFIG.SYNC_URL);
  if (bad) { out.innerHTML = '⚠ ' + bad; return; }
  const log = [];
  const say = () => { out.innerHTML = log.join('<br>'); };
  out.textContent = '확인 중…';

  try {
    const r = await fetch(CONFIG.SYNC_URL + '?action=ping');
    const ct = r.headers.get('content-type') || '';
    if (ct.indexOf('json') === -1) {
      log.push('① JSON 대신 HTML 응답 — 액세스 권한이 "모든 사용자"가 아닙니다');
      say(); return;
    }
    const j = await r.json();
    log.push(j && j.ok ? '① 응답 확인 OK' : '① 응답했지만 ok=false');
  } catch (e) {
    log.push('① 연결 실패 — 배포 시 액세스 권한을 "모든 사용자"로 설정했는지, 새 버전으로 재배포했는지 확인하세요');
    say(); return;
  }
  say();

  const probe = '__connection_test__';
  try {
    const r = await fetch(CONFIG.SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'save', name: probe, token: CONFIG.ACCESS_TOKEN,
        state: { xp: 1, practice: {}, check: {}, review: [] }
      })
    });
    const j = await r.json();
    log.push(j && j.ok ? '② 쓰기 OK'
      : '② 쓰기 거부 — ' + ((j && j.error) || 'SHEET_ID 를 확인하세요')
        + (j && j.error && j.error.indexOf('등록되지') === 0
            ? ' (ROSTER_GATE 가 켜져 있으면 이 테스트는 거부됩니다. 정상입니다.)' : ''));
  } catch (e) {
    log.push('② 쓰기 실패 — ' + e.message);
    say(); return;
  }
  say();

  try {
    const r = await fetch(CONFIG.SYNC_URL + '?action=load&name=' + encodeURIComponent(probe) + tokenParam());
    const j = await r.json();
    log.push(j && j.state && j.state.xp === 1
      ? '③ 읽기 OK — 서버 연결이 정상입니다'
      : '③ 읽기했지만 저장된 값이 없습니다 — 스프레드시트 progress 시트를 확인하세요');
  } catch (e) {
    log.push('③ 읽기 실패 — ' + e.message);
  }
  say();
}

/* ============================================================================
   12. 부트
   ========================================================================== */
async function boot(name) {
  const remote = await syncLoad(name);
  const local = store.get(KEY(name));
  let st = remote || (local ? JSON.parse(local) : null) || blankState(name);
  // 서버·로컬 병합: 더 많이 푼 쪽을 채택
  if (remote && local) {
    const l = JSON.parse(local);
    if (Object.keys(l.practice).length > Object.keys(remote.practice || {}).length) st = l;
  }
  st.name = name;
  st.practice = st.practice || {}; st.check = st.check || {}; st.review = st.review || [];
  st.reflect = st.reflect || {}; st.work = st.work || {};
  st.sent = st.sent || {};
  if (typeof st.reflectSent === 'string' && st.reflectSent) {   // 옛 형식 이관
    st.sent.reflect = st.reflectSent;
  }
  delete st.reflectSent;
  S = st;
  bumpStreak(); saveState();

  $('#gate').classList.add('hidden');
  $('#shell').classList.remove('hidden');
  $('#tbWho').textContent = name;
  const key = animalFor(name);
  $('#tbFace').innerHTML = animalSvg(key, 30);
  $('#meFace').innerHTML = animalSvg(key, 40);
  $('#meName').textContent = name;
  $('#meAnimal').textContent = animalName(key);
  renderStats(); renderUnitList();

  const firstOpen = BANK.units.find(u => qOfUnit(u.id, 'practice').length || qOfUnit(u.id, 'check').length);
  if (firstOpen) openUnit(firstOpen.id);
  else $('#stage').innerHTML = `<div class="panel"><div class="empty">
      <span class="ic">📄</span><p>아직 등록된 문항이 없습니다</p>
      <small>questions.json 에 단원과 문항을 추가하면 여기에 바로 나타납니다.<br>
      형태는 questions.example.json 을 참고하세요.</small></div></div>`;

  if (new URLSearchParams(location.search).get('dev') === '1') renderDev();
  if (!store.persistent) toast('이 브라우저는 저장을 막고 있어요. 기록이 유지되지 않습니다.');
  if (SYNC_BLOCKED) toast('서버 저장이 거부됐어요: ' + SYNC_BLOCKED);
}

let gateBusy = false;

async function tryEnter() {
  if (gateBusy) return;
  const raw = $('#nameInput').value.trim();
  const err = $('#gateErr');

  if (raw.length < 2) { err.innerHTML = '이름을 두 글자 이상 입력해 주세요.'; return; }

  gateBusy = true;
  const btn = $('#startBtn');
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '확인 중…';
  err.textContent = '';

  const res = await verifyName(raw);

  if (!res.ok) {
    const why = diagnoseUrl(CONFIG.SYNC_URL);
    // 서버가 사유를 알려준 경우가 가장 정확하므로 먼저 씁니다
    if (res.reason === 'server' && /토큰/.test(res.message || '')) {
      err.innerHTML = '<b>서버 암호가 일치하지 않습니다.</b><br>'
        + 'sync.gs 의 ACCESS_TOKEN 과 config.json 의 ACCESS_TOKEN 값이 같아야 합니다.';
    } else if (res.reason === 'server' && res.message) {
      err.innerHTML = '<b>서버가 요청을 거부했습니다.</b><br>' + esc(res.message);
    } else if (why) {
      err.innerHTML = '<b>서버 주소 설정에 문제가 있습니다.</b><br>' + why;
    } else if (res.reason === 'html') {
      err.innerHTML = '<b>서버가 응답하지 않습니다.</b><br>'
        + 'Apps Script 배포의 액세스 권한이 "모든 사용자" 인지 확인해 주세요.';
    } else {
      err.innerHTML = '<b>서버에 연결할 수 없습니다.</b><br>'
        + '주소 형태는 정상입니다. 다음을 확인해 주세요.<br>'
        + '① 배포 액세스 권한이 "모든 사용자" 인지<br>'
        + '② 시크릿 창에서 그 주소를 열면 <span class="mono">{"ok":true...}</span> 가 나오는지<br>'
        + '③ 코드를 수정한 뒤 "새 버전" 으로 재배포했는지';
    }
    btn.disabled = false; btn.textContent = label; gateBusy = false;
    return;
  }
  if (!res.allowed) {
    err.innerHTML = '<b>등록되지 않은 이름입니다.</b><br>이름을 정확히 입력했는지 확인해 주세요. 계속 안 되면 담당자에게 문의해 주세요.';
    btn.disabled = false; btn.textContent = label; gateBusy = false;
    return;
  }

  if (BANK_ERRORS.length) {
    err.textContent = `문항 데이터에 오류가 ${BANK_ERRORS.length}건 있습니다. 담당자에게 알려주세요.`;
  }
  store.set('tl:last', res.name);
  await boot(res.name);
  btn.disabled = false; btn.textContent = label; gateBusy = false;
}

$('#startBtn').addEventListener('click', tryEnter);
$('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
$('#nameInput').addEventListener('input', () => { $('#gateErr').textContent = ''; });
$('#logoutBtn').addEventListener('click', () => {
  if (!confirm('나가면 이 화면이 닫혀요. 기록은 이름으로 남아 있습니다.')) return;
  location.reload();
});
$('#reviewBtn').addEventListener('click', openReview);

(async () => {
  await loadConfig();
  try {
    await loadBank();
  } catch (e) {
    $('#gateErr').textContent = e.message;
    return;
  }
  const last = store.get('tl:last');
  if (last) $('#nameInput').value = last;
  $('#nameInput').focus();
})();
</script>
