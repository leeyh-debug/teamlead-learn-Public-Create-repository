<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀장 과정 · 밀당PT 수학온택트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   CONFIG 는 </body> 직전 스크립트 상단에 있습니다.
   ============================================================ */
:root{
  --ink:        #0E1B2E;
  --ink-2:      #1B3A6B;
  --paper:      #F4F6FA;
  --card:       #FFFFFF;
  --line:       #D8E0EA;
  --line-2:     #B8C5D6;
  --muted:      #4F6178;
  --muted-2:    #6E8099;

  /* 현재 단원 색. 단원을 열 때 자바스크립트가 덮어씁니다 */
  --u:          #1B3A6B;
  --u-soft:     #EEF2F8;

  /* 판단 스펙트럼: 0점(미흡) → 3점(최선). 신호등 대신 단일 색상 램프 */
  --s0: #8494A8;
  --s1: #4E7FA8;
  --s2: #1E8E9E;
  --s3: #0FA58C;

  --check:      #B4761C;   /* 체크 모드 = 평가 중 */
  --check-bg:   #FBF3E4;
  --danger:     #C4463C;

  --r-sm: 6px;
  --r:    10px;
  --r-lg: 16px;

  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--sans);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.6;
  /* 현재 단원 색이 배경에 아주 옅게 번집니다 */
  background:
    radial-gradient(58rem 30rem at 92% -6%, color-mix(in srgb, var(--u) 22%, transparent) 0%, transparent 64%),
    radial-gradient(46rem 26rem at 2% 4%, color-mix(in srgb, var(--u) 13%, transparent) 0%, transparent 58%),
    linear-gradient(180deg, #FBFCFE 0%, var(--paper) 42%, #EAEFF6 100%);
  background-repeat:no-repeat;
  min-height:100vh;
  transition:background .35s ease;
}
button{ font-family:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--ink-2); outline-offset:2px;
}
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
/* 한글을 모노 폰트로 쓰면 흐릿하게 렌더링됩니다. 라벨은 본문 서체로. */
.eyebrow{
  font-family:var(--sans); font-size:12.5px; font-weight:700;
  letter-spacing:.02em; color:#5A6D85;
}
.eyebrow.tinted{ color:var(--u); }
.hidden{ display:none !important; }

/* ---------- 진입 화면 ---------- */
#gate{
  min-height:100vh; display:grid; place-items:center; padding:24px;
  background:
    radial-gradient(60rem 30rem at 50% -10%, #16305A 0%, transparent 70%),
    var(--ink);
}
.gate-card{ width:100%; max-width:420px; color:#fff; text-align:left; }
.gate-mark{
  font-size:13.5px; font-weight:700; letter-spacing:.02em;
  color:#8FB0DA; margin-bottom:26px;
}
.gate-card h1{
  font-size:30px; font-weight:800; letter-spacing:-.03em;
  margin:0 0 14px; line-height:1.25;
}
.gate-card p{ color:#B6C9E2; font-size:15.5px; margin:0 0 28px; line-height:1.6; }
.gate-card label{
  display:block; font-size:13px; font-weight:700;
  color:#A9C2E4; margin-bottom:8px;
}
.gate-card input{
  width:100%; padding:13px 14px; font-size:15px; font-family:inherit;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r); color:#fff;
}
.gate-card input::placeholder{ color:#6F86A6; }
.gate-card button{
  width:100%; margin-top:14px; padding:13px; font-size:15px; font-weight:700;
  background:#fff; color:var(--ink); border:0; border-radius:var(--r);
}
.gate-note{ font-size:13.5px; color:#A2B8D6; margin-top:18px; line-height:1.7; }
.gate-err{ min-height:0; margin-top:12px; }
.gate-err:not(:empty){
  background:rgba(196,70,60,.16); border:1px solid rgba(240,169,162,.45);
  border-radius:var(--r); padding:11px 13px; color:#F6C7C2;
  font-size:13px; line-height:1.55;
}
.gate-err b{ color:#fff; font-weight:700; }
.gate-err .mono{ font-size:12px; color:#fff; }

/* ---------- 상단바 ---------- */
.topbar{
  position:sticky; top:0; z-index:30; color:#fff;
  display:flex; align-items:center; gap:14px; padding:0 20px; height:60px;
  background:linear-gradient(100deg, var(--ink) 0%, #16294A 58%, color-mix(in srgb, var(--u) 42%, #16294A) 100%);
  border-bottom:3px solid var(--u);
}
.topbar .brand{ font-size:14px; font-weight:700; letter-spacing:-.01em; }
.topbar .brand span{ color:#7E9AC4; font-weight:500; }
.topbar .spacer{ flex:1; }
.chip{
  display:inline-flex; align-items:baseline; gap:6px;
  font-family:var(--mono); font-size:13px; padding:6px 11px;
  background:rgba(255,255,255,.12); border-radius:100px; white-space:nowrap;
}
.chip b{ font-size:14px; font-weight:700; }
.chip i{ font-family:var(--sans); font-style:normal; color:#B9CEE8; font-size:12px; font-weight:600; }
.topbar .who{ font-size:14px; color:#D6E2F0; font-weight:500; }
.ghost-btn{
  background:transparent; border:1px solid rgba(255,255,255,.28);
  color:#C3D2E6; font-size:12px; padding:6px 11px; border-radius:var(--r-sm);
}

/* ---------- 레이아웃 ---------- */
.wrap{ max-width:1080px; margin:0 auto; padding:28px 20px 80px; }
.cols{ display:grid; grid-template-columns:306px 1fr; gap:24px; align-items:start; }
@media (max-width:860px){
  .cols{ grid-template-columns:1fr; }
  .cols > aside{ order:2; }
  .cols > #stage{ order:1; }
}
/* 좁은 화면에서는 상단바를 이름·정확도까지 다 밀어넣지 않습니다 */
@media (max-width:720px){
  .topbar{ padding:0 13px; gap:8px; height:56px; flex-wrap:nowrap; }
  .topbar .brand{ font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .brand span{ display:none; }
  .topbar .who, .topbar .chip.opt{ display:none; }
  .ghost-btn{ white-space:nowrap; padding:6px 10px; }
  .wrap{ padding:16px 14px 64px; }
}
@media (max-width:420px){
  .topbar .chip{ padding:5px 9px; font-size:12px; }
  .topbar .chip i{ display:none; }
}

.panel{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:18px;
}
.panel + .panel{ margin-top:16px; }
.panel-h{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}

/* ---------- 통계 ---------- */


/* 내 기록 */
.me-panel{ border-top:3px solid var(--u); }
.me-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.me-face{
  flex:none; width:52px; height:52px; border-radius:16px; display:grid; place-items:center;
  background:#EEF2F8; background:color-mix(in srgb, var(--u) 14%, white);
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--u) 22%, white);
}
.me-face .avatar{ display:block; }
.me-id{ display:flex; flex-direction:column; min-width:0; }
.me-name{ font-size:17px; font-weight:800; letter-spacing:-.03em; }
.me-animal{ font-size:12.5px; color:var(--muted); font-weight:600; margin-top:1px; }
.tb-face{ flex:none; display:grid; place-items:center; width:30px; height:30px; }

/* 지표 4칸 — 각기 다른 색으로 구분 */
.stat-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:9px;
  background:none; border-radius:0; overflow:visible;
}
.stat{
  padding:11px 12px; border-radius:12px; border:1px solid transparent;
}
.stat .v{ font-family:var(--mono); font-size:23px; font-weight:700; letter-spacing:-.03em; }
.stat .k{ font-size:12.5px; font-weight:600; margin-top:2px; }
.stat.s-xp{     background:#EAF2FB; border-color:#C6DCF3; }
.stat.s-xp .v{ color:#17548F; } .stat.s-xp .k{ color:#3D6E9F; }
.stat.s-done{   background:#EAF6EF; border-color:#C2E4D0; }
.stat.s-done .v{ color:#1B6B42; } .stat.s-done .k{ color:#3C8060; }
.stat.s-streak{ background:#FDF0E7; border-color:#F3D3BC; }
.stat.s-streak .v{ color:#A9541A; } .stat.s-streak .k{ color:#96603A; }
.stat.s-acc{    background:#F2EDFA; border-color:#D9CDEF; }
.stat.s-acc .v{ color:#5A3E9E; } .stat.s-acc .k{ color:#6D579C; }

/* ---------- 단원 목록 ---------- */
.unit-list{ display:flex; flex-direction:column; gap:8px; }
.unit-btn{
  display:block; width:100%; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r);
  padding:11px 12px 11px 13px; transition:border-color .12s, box-shadow .12s;
}
.unit-btn:hover:not(:disabled){ border-color:var(--u); }
.unit-btn[aria-current="true"]{
  border-color:var(--u); box-shadow:inset 3px 0 0 var(--u), 0 1px 3px rgba(14,27,46,.06);
}
.unit-btn:disabled{ opacity:.45; cursor:not-allowed; }
.unit-btn .row{ display:flex; align-items:center; gap:10px; }
.unit-btn .qn{ align-self:flex-start; margin-top:2px; }
.unit-btn .ic{
  flex:none; width:28px; height:28px; border-radius:8px; font-size:15px; line-height:1;
  display:grid; place-items:center;
  background:#F1F4F9; background:color-mix(in srgb, var(--u) 14%, white);
}
.unit-btn .nm{ font-size:15px; font-weight:600; flex:1; letter-spacing:-.02em; line-height:1.3; }
.unit-btn .qn{ font-family:var(--mono); font-size:12px; color:var(--muted-2); font-weight:600; }
.unit-btn .sub{ font-size:13.5px; color:var(--muted); margin-top:4px; font-weight:500; }

/* 진도 바 */
.bar{ height:5px; background:#E7ECF3; border-radius:100px; margin-top:9px; overflow:hidden; }
.bar > i{ display:block; height:100%; background:var(--u); border-radius:100px; }
.bar.done > i{ background:var(--s3); }

/* ---------- 단원 상세 ---------- */
.panel.unit-panel{ border-top:3px solid var(--u); padding-top:16px; }
.unit-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:4px; }
.unit-head .big-ic{
  flex:none; width:52px; height:52px; border-radius:14px; font-size:26px;
  display:grid; place-items:center;
  background:#F1F4F9; background:color-mix(in srgb, var(--u) 13%, white);
}
.unit-head h2{ font-size:24px; font-weight:800; letter-spacing:-.035em; margin:3px 0 5px; }
.unit-head p{ margin:0; color:var(--muted); font-size:14.5px; }

.mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px; }
@media (max-width:620px){ .mode-grid{ grid-template-columns:1fr; } }
.mode-card{
  border:1px solid var(--line); border-radius:var(--r);
  padding:15px; display:flex; flex-direction:column; gap:9px;
}
.mode-card.practice{ border-color:color-mix(in srgb, var(--u) 35%, white); background:color-mix(in srgb, var(--u) 5%, white); }
.mode-card.practice .rules li::before{ background:var(--u); }
.btn.unit{ background:var(--u); }
.mode-card.check{ border-color:#E6D2AC; background:var(--check-bg); }
.mode-card h3{ margin:0; font-size:16.5px; font-weight:700; letter-spacing:-.02em; }
.mode-card .rules{ margin:0; padding:0; list-style:none; font-size:13px; color:var(--muted); }
.mode-card .rules li{ padding-left:11px; position:relative; }
.mode-card .rules li::before{
  content:''; position:absolute; left:0; top:9px;
  width:3px; height:3px; border-radius:50%; background:var(--line-2);
}
.mode-card.check .rules li::before{ background:#D3B27C; }
.btn{
  border:0; border-radius:var(--r-sm); padding:12px 16px;
  font-size:15px; font-weight:700; background:var(--ink); color:#fff;
  margin-top:auto;
}
.btn:disabled{ background:var(--line-2); color:#F4F6FA; cursor:not-allowed; }
.btn.amber{ background:var(--check); }
.btn.quiet{ background:transparent; color:var(--ink-2); border:1px solid var(--line-2); }
.btn.sm{ padding:8px 12px; font-size:13px; }
.lock-why{ font-size:12px; color:var(--check); font-family:var(--mono); font-weight:600; }

/* ---------- 문항 실행 ---------- */
.runner{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; }
.runner.check-mode{ border-color:#E6D2AC; }
.runner{ border-top:3px solid var(--u); }
.runner-bar{
  display:flex; align-items:center; gap:12px;
  padding:12px 18px; border-bottom:1px solid var(--line);
  background:#F7F9FC; background:color-mix(in srgb, var(--u) 6%, white);
}
.runner-bar .mode-tag.prac{ background:var(--u); }
.runner.check-mode .runner-bar{ background:var(--check-bg); border-bottom-color:#EBDCBE; }
.runner-bar .mode-tag{
  font-family:var(--sans); font-size:12.5px; font-weight:700; letter-spacing:-.01em;
  padding:5px 11px; border-radius:100px; background:var(--ink); color:#fff;
}
.runner.check-mode .runner-bar .mode-tag{ background:var(--check); }
.runner-bar .pos{ font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ink-2); }
.runner-bar .spacer{ flex:1; }
.hearts{ font-size:15px; letter-spacing:2px; }
.runner-body{ padding:22px 18px 20px; }
@media (min-width:620px){ .runner-body{ padding:26px 26px 22px; } }

.q-type{ margin-bottom:9px; }
.q-context{
  font-size:14px; color:var(--ink); background:#F2F5FA;
  border-left:3px solid var(--u); padding:11px 14px;
  border-radius:0 var(--r-sm) var(--r-sm) 0; margin-bottom:16px;
  white-space:pre-wrap; line-height:1.6;
}
.q-prompt{
  font-size:20px; font-weight:700; letter-spacing:-.03em;
  line-height:1.45; margin:0 0 20px; white-space:pre-wrap;
}

/* 선택지 */
.choices{ display:flex; flex-direction:column; gap:8px; }
.choice{
  display:flex; gap:11px; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line-2); border-radius:var(--r);
  padding:14px 15px; font-size:15.5px; font-weight:500; line-height:1.55; color:var(--ink);
  transition:border-color .12s, background .12s;
}
.choice:hover:not(:disabled){ border-color:var(--u); background:color-mix(in srgb, var(--u) 5%, white); }
.choice:disabled{ cursor:default; }
.choice .key{
  flex:none; width:24px; height:24px; border-radius:var(--r-sm);
  background:#EAEFF6; color:var(--ink-2); font-family:var(--mono);
  font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:1px;
}
.choice .txt{ flex:1; }
.choice[data-picked="true"]{ box-shadow:0 0 0 2px var(--ink); }
.choice.best{
  border-color:var(--s3); border-width:2px; padding:13px 14px;
  background:#F1FAF7;
}
.choice.best .chtext, .choice.best .txt{ font-weight:600; }
.choice.miss{ opacity:.72; }

/* 채점 후 노출: 점수 칩 */
.score-chip{
  flex:none; font-family:var(--mono); font-size:12px; font-weight:700;
  padding:2px 8px; border-radius:100px; color:#fff; height:22px; margin-top:2px;
  display:inline-flex; align-items:center;
}
.sc-0{ background:var(--s0); } .sc-1{ background:var(--s1); }
.sc-2{ background:var(--s2); } .sc-3{ background:var(--s3); }
.choice .why{
  font-size:13.5px; font-weight:400; color:var(--muted); margin-top:9px;
  padding-top:9px; border-top:1px dashed var(--line-2); line-height:1.6;
}

/* 숫자 입력 */
.num-row{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
.num-row input{
  width:180px; padding:13px 14px; font-family:var(--mono); font-size:18px; font-weight:600;
  border:2px solid var(--line-2); border-radius:var(--r); background:var(--card); color:var(--ink);
}
.num-row input:focus{ border-color:var(--u); }
.num-row .unit-label{ font-size:15px; color:var(--muted); font-weight:600; }
.hint-btn{
  background:none; border:0; color:var(--u); font-size:13.5px; font-weight:600;
  text-decoration:underline; padding:0; margin-top:14px;
}
.hint-box{
  font-size:13.5px; color:var(--ink); background:#F2F5FA;
  border-left:3px solid var(--u);
  padding:11px 14px; border-radius:0 var(--r-sm) var(--r-sm) 0; margin-top:10px;
  white-space:pre-wrap; line-height:1.6;
}

/* 서술 / 미션 */
.free-input{
  width:100%; min-height:170px; padding:13px; font-family:inherit; font-size:14px;
  line-height:1.6; border:1px solid var(--line-2); border-radius:var(--r);
  resize:vertical; color:var(--ink); background:var(--card);
}
.rubric{
  margin-top:12px; border:1px solid var(--line); border-radius:var(--r);
  padding:12px 14px; background:#FBFCFE;
}
.rubric .eyebrow{ display:block; margin-bottom:7px; }
.rubric ul{ margin:0; padding-left:17px; font-size:12.5px; color:var(--muted); }
.counter{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--muted); margin-top:7px; text-align:right; }

/* 시그니처: 판단 스펙트럼 */
.spectrum{ margin-top:20px; padding-top:18px; border-top:1px solid var(--line); }
.spectrum .eyebrow{ display:block; margin-bottom:10px; }
.spec-track{ padding:0 40px; }
.spec-inner{ position:relative; height:34px; }
.spec-rail{
  position:absolute; left:0; right:0; top:15px; height:4px; border-radius:100px;
  background:linear-gradient(90deg, var(--s0), var(--s1), var(--s2), var(--s3));
}
.spec-mark{ position:absolute; top:0; transform:translateX(-50%); text-align:center; width:74px; }
.spec-mark .dot{
  width:11px; height:11px; border-radius:50%; margin:11px auto 0;
  border:2.5px solid var(--card); box-shadow:0 0 0 1.5px currentColor;
}
.spec-mark .lb{ font-family:var(--sans); font-size:12px; font-weight:700; margin-top:4px; display:block; }
.spec-mark.me{ color:var(--ink); }
.spec-mark.me .dot{ background:var(--ink); }
.spec-mark.best{ color:var(--s3); }
.spec-mark.best .dot{ background:var(--s3); }
.spec-gap{
  font-size:14.5px; margin-top:6px; padding:13px 15px; border-radius:var(--r-sm);
  background:#F2F5FA; color:var(--ink); line-height:1.6;
}
.spec-gap b{ font-weight:700; }

.foot{
  display:flex; align-items:center; gap:10px; margin-top:20px;
  padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap;
}
.foot .spacer{ flex:1; }
.foot .note{ font-size:13.5px; color:var(--muted); }

/* ---------- 세션 종료 ---------- */
.done-wrap{ text-align:left; }
.done-wrap h2{ font-size:25px; font-weight:800; letter-spacing:-.035em; margin:0 0 7px; }
.done-wrap .lead{ color:var(--muted); font-size:14.5px; margin:0 0 20px; }
.kv{ display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--line); border-radius:var(--r); overflow:hidden; margin-bottom:18px; }
.kv > div{ background:var(--card); padding:13px 15px; }
.kv .v{ font-family:var(--mono); font-size:24px; font-weight:700; letter-spacing:-.03em; }
.kv .k{ font-size:12.5px; color:var(--muted); margin-top:2px; }

/* 역량 프로파일 */
.tagrow{ display:flex; align-items:center; gap:11px; padding:7px 0; }
.tagrow .nm{ font-size:14px; font-weight:500; width:150px; flex:none; }
.tagrow .tr{ flex:1; height:6px; background:var(--line); border-radius:100px; overflow:hidden; }
.tagrow .tr > i{ display:block; height:100%; border-radius:100px; }
.tagrow .pc{ font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink); width:42px; text-align:right; flex:none; }

<body>

<!-- ===================== 진입 ===================== -->

    <label for="nameInput">이름</label>

    연습 모드는 몇 번이든 다시 풀 수 있고, 체크 모드는 단원당 한 번만 제출됩니다.</p>

<!-- ===================== 본 화면 ===================== -->
<div id="shell" class="hidden">
  <header class="topbar">

            <div class="stat s-streak"><div class="v mono" id="stStreak">0</div><div class="k">연속 학습일</div></div>

        </div>

<script>
/* ============================================================================
   1. CONFIG — 운영자가 만지는 곳
   ========================================================================== */
const CONFIG = {
  // ⚠️ 이 파일은 고치지 마세요.
  // 서버 주소는 같은 폴더의 config.json 에서 설정합니다.

  // 문항 뱅크 위치. 같은 폴더의 questions.json 을 읽습니다.
  QUESTIONS_URL: 'questions.json',

  // Apps Script 웹앱 URL. 비워두면 브라우저에만 저장되고,
  // 체크 모드 제출은 JSON 파일 다운로드로 대체됩니다.
  // 배포 시 액세스 권한이 "모든 사용자" 여야 합니다.
  SYNC_URL: '',

  // sync.gs 의 ACCESS_TOKEN 과 같은 값. 양쪽 모두 비워두면 검사하지 않습니다.
  ACCESS_TOKEN: '',

  // 체크 모드 해금 조건 — 해당 단원 연습 모드 완료율
  UNLOCK_RATIO: 0.8,

  // 연습 모드 하트. 0 이면 하트 없음(무제한)
  HEARTS: 3,

  // XP: 획득 점수 1점당
  XP_PER_POINT: 10,

  // 서술/미션 최소 글자 수
  MIN_CHARS: 120,
};

/* config.json 이 있으면 CONFIG 를 덮어씁니다. 없으면 위 기본값을 씁니다. */
async function loadConfig() {
  try {
    const r = await fetch('config.json?v=' + Date.now());
    if (!r.ok) return;
    const j = await r.json();
    ['SYNC_URL', 'ACCESS_TOKEN'].forEach(k => {
      if (typeof j[k] === 'string') CONFIG[k] = j[k].trim();
    });
  } catch (e) { /* 파일이 없으면 그냥 넘어갑니다 */ }
}

/* ============================================================================
   2. 저장소 — localStorage 실패 시 메모리로 자동 대체
   ========================================================================== */
const store = (() => {
  let mem = {}, ok = false;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); ok = true; } catch (e) { ok = false; }
  return {
    persistent: ok,
    get(k) { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { try { if (ok) localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } },
    del(k) { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; } }
  };
})();

const KEY = n => 'tl:' + n.trim().toLowerCase().replace(/\s+/g, '');

/* ============================================================================
   3. 상태
   ========================================================================== */
let BANK = { units: [], questions: [] };
let BANK_ERRORS = [];
let S = null;          // 진행 상태
let CUR_UNIT = null;   // 선택된 단원 id
let RUN = null;        // 실행 중 세션

function blankState(name) {
  return {
    name, xp: 0, streak: 0, lastDay: null,
    practice: {},   // qid -> { best, max, tries }
    check: {},      // unitId -> { submittedAt, elapsedSec, items:[...], auto:{got,max}, manual:[...] }
    review: [],     // qid 목록
    reflect: {},    // qid -> [{ text, at }, ...]  회차별 기록
    work: {},       // qid -> [{ a, b, value, memo, at }, ...]
    sent: {}        // unitId -> 제출 시각
  };
}

const todayStr = () => new Date().toISOString().slice(0, 10);

function bumpStreak() {
  const t = todayStr();
  if (S.lastDay === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.streak = (S.lastDay === y) ? S.streak + 1 : 1;
  S.lastDay = t;
}

/* ============================================================================
   4. 문항 뱅크 로드 + 검증
   ========================================================================== */
const CHOICE_TYPES = ['knowledge', 'situation'];
const FREE_TYPES = ['mission', 'essay'];
const ALL_TYPES = [...CHOICE_TYPES, 'number', ...FREE_TYPES, 'reflect', 'worksheet'];

const TYPE_LABEL = {
  knowledge: '지식 확인', number: '숫자 해석', situation: '상황 판단',
  mission: '미션', essay: '서술', reflect: '성찰', worksheet: '계산 기록'
};

async function loadBank() {
  const res = await fetch(CONFIG.QUESTIONS_URL + '?v=' + Date.now());
  if (!res.ok) throw new Error('questions.json 을 불러올 수 없습니다 (HTTP ' + res.status + ')');
  const raw = await res.json();
  BANK_ERRORS = [];

  const units = (raw.units || []).slice().sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
  const unitIds = new Set(units.map(u => u.id));
  const seen = new Set();
  const questions = [];

  (raw.questions || []).forEach((q, i) => {
    const at = `questions[${i}]${q.id ? ' (' + q.id + ')' : ''}`;
    const err = m => BANK_ERRORS.push(at + ' — ' + m);

    if (!q.id) { err('id 없음'); return; }
    if (seen.has(q.id)) { err('id 중복'); return; }
    seen.add(q.id);
    if (!unitIds.has(q.unit)) { err('units 에 없는 unit: ' + q.unit); return; }
    if (!ALL_TYPES.includes(q.type)) { err('알 수 없는 type: ' + q.type); return; }
    if (!q.prompt) { err('prompt 없음'); return; }

    q.modes = Array.isArray(q.modes) && q.modes.length ? q.modes : ['practice', 'check'];
    q.tags = Array.isArray(q.tags) ? q.tags : [];

    if (CHOICE_TYPES.includes(q.type)) {
      if (!Array.isArray(q.choices) || q.choices.length < 2) { err('choices 2개 이상 필요'); return; }
      q.choices.forEach((c, ci) => {
        if (typeof c.score !== 'number') err(`choices[${ci}].score 가 숫자가 아님`);
      });
      const max = Math.max(...q.choices.map(c => Number(c.score) || 0));
      if (max <= 0) { err('최고점 선택지가 없음 (score 가 모두 0)'); return; }
      q.maxScore = max;
    } else if (q.type === 'number') {
      if (!q.accept || typeof q.accept.value !== 'number') { err('accept.value 필요'); return; }
      q.accept.tolerance = Number(q.accept.tolerance) || 0;
      q.maxScore = Number(q.maxScore) || 1;
    } else if (q.type === 'reflect') {
      q.maxScore = 0;                          // 채점하지 않음
      q.think = Array.isArray(q.think) ? q.think : [];
      q.placeholder = q.placeholder || '떠오르는 대로 적어보세요';
    } else if (q.type === 'worksheet') {
      q.maxScore = 0;
      if (!Array.isArray(q.inputs) || q.inputs.length < 2) { err('inputs 2개 이상 필요'); return; }
      if (['ratio', 'sumRatio', 'sum2Ratio'].indexOf(q.calc) === -1) {
        err('calc 는 ratio · sumRatio · sum2Ratio 중 하나'); return;
      }
      if (q.calc === 'sum2Ratio' && q.inputs.length < 3) { err('sum2Ratio 는 inputs 3개 필요'); return; }
    } else {
      q.maxScore = Number(q.maxScore) || 0;   // 사람이 채점
      q.autoScored = false;
    }
    questions.push(q);
  });

  BANK = { units, questions, version: raw.version || '—' };
}

const qOfUnit = (unitId, mode) =>
  BANK.questions.filter(q => q.unit === unitId && q.modes.includes(mode));

const NO_SCORE = ['mission', 'essay', 'reflect', 'worksheet'];
const isAuto = q => NO_SCORE.indexOf(q.type) === -1;

/* 성찰 단원 = 그 단원의 문항이 모두 reflect 타입 */
const reflectQs = unitId =>
  BANK.questions.filter(q => q.unit === unitId && q.type === 'reflect');
function isReflectUnit(unitId) {
  const all = BANK.questions.filter(q => q.unit === unitId);
  return all.length > 0 && all.every(q => q.type === 'reflect');
}
const workQs = unitId => BANK.questions.filter(q => q.unit === unitId && q.type === 'worksheet');
function isWorkUnit(unitId) {
  const all = BANK.questions.filter(q => q.unit === unitId);
  return all.length > 0 && all.every(q => q.type === 'worksheet');
}
const workWritten = unitId => workQs(unitId).filter(q => (S.work[q.id] || []).length).length;
function workRound(unitId) {
  const qs = workQs(unitId);
  if (!qs.length) return 0;
  return Math.max(...qs.map(q => (S.work[q.id] || []).length));
}
/* 값 묶음(키 → 숫자)으로부터 비율과 산식 문자열을 만듭니다.
   ratio      a ÷ b
   sumRatio   a ÷ (a + b)
   sum2Ratio  (a + b) ÷ c            */
function calcFrom(q, v) {
  const need = q.inputs.map(f => f.key);
  if (need.some(k => v[k] === null || v[k] === undefined)) return { value: null, expr: '' };
  const n = k => v[k];
  let num, den, expr;
  if (q.calc === 'sumRatio') {
    num = n('a'); den = n('a') + n('b');
    expr = `${n('a')} ÷ (${n('a')} + ${n('b')}) × 100`;
  } else if (q.calc === 'sum2Ratio') {
    num = n('a') + n('b'); den = n('c');
    expr = `(${n('a')} + ${n('b')}) ÷ ${n('c')} × 100`;
  } else {
    num = n('a'); den = n('b');
    expr = `${n('a')} ÷ ${n('b')} × 100`;
  }
  if (!isFinite(den) || den === 0) return { value: null, expr: '분모가 0입니다' };
  return { value: (num / den) * 100, expr };
}
/* 저장된 기록에서 산식을 다시 만들 때 */
const exprOf = (q, rec) => calcFrom(q, rec).expr.replace(' × 100', '');
/* 회차: 모든 문항이 n번 이상 작성된 최대 n */
function reflectRound(unitId) {
  const qs = reflectQs(unitId);
  if (!qs.length) return 0;
  return Math.min(...qs.map(q => (S.reflect[q.id] || []).length));
}
const reflectWritten = unitId =>
  reflectQs(unitId).filter(q => (S.reflect[q.id] || []).length).length;

/* ---- 단원 진행률 ---- */
function practiceProgress(unitId) {
  const qs = qOfUnit(unitId, 'practice');
  if (!qs.length) return { done: 0, total: 0, ratio: 0 };
  const done = qs.filter(q => S.practice[q.id]).length;
  return { done, total: qs.length, ratio: done / qs.length };
}
function checkUnlocked(unitId) {
  const p = practiceProgress(unitId);
  return p.total > 0 && p.ratio >= CONFIG.UNLOCK_RATIO;
}

/* ============================================================================
   5. 동기화
   ========================================================================== */
/* 서버 주소 형태만 보고 잡을 수 있는 설정 실수를 진단합니다.
   문제가 없으면 null 을 돌려줍니다. */
function diagnoseUrl(u) {
  u = String(u || '').trim();
  if (!u) return 'config.json 의 SYNC_URL 이 비어 있습니다.';
  if (u.indexOf('script.googleusercontent.com') > -1)
    return '주소를 잘못 복사했습니다. 브라우저 주소창이 아니라 Apps Script <b>배포 관리</b> 화면에 표시된 URL 을 넣어야 합니다.';
  if (u.indexOf('/a/macros/') > -1)
    return '배포가 회사 도메인으로 제한되어 있습니다. Apps Script 에서 <b>배포 관리 → 연필 → 액세스 권한을 "모든 사용자"</b> 로 바꾸고, 새로 표시된 URL 을 다시 넣어주세요.';
  if (u.indexOf('http://') === 0)
    return '주소가 <b>https://</b> 로 시작해야 합니다.';
  if (u.indexOf('https://') !== 0)
    return '주소가 <b>https://</b> 로 시작해야 합니다.';
  if (u.indexOf('script.google.com') === -1)
    return 'Apps Script 주소가 아닙니다. <b>script.google.com</b> 으로 시작하는 주소여야 합니다.';
  if (!/\/exec\/?$/.test(u.split('?')[0]))
    return '주소가 <b>/exec</b> 로 끝나야 합니다. /dev 로 끝나는 테스트 주소는 쓸 수 없습니다.';
  return null;
}

/* 서버 명단에 등록된 이름인지 확인합니다.
   { ok, allowed, name }  ok=false 면 서버 문제, allowed=false 면 미등록 */
async function verifyName(name) {
  if (!CONFIG.SYNC_URL) return { ok: true, allowed: true, name, offline: true };
  try {
    const r = await fetch(CONFIG.SYNC_URL + '?action=verify&name='
      + encodeURIComponent(name) + tokenParam());
    const ct = r.headers.get('content-type') || '';
    if (ct.indexOf('json') === -1) {
      return { ok: false, reason: 'html' };
    }
    const j = await r.json();
    if (!j || j.ok !== true) return { ok: false, reason: 'server', message: (j && j.error) || '' };
    return { ok: true, allowed: !!j.allowed, name: j.name || name };
  } catch (e) {
    return { ok: false, reason: 'network' };
  }
}

let SYNC_BLOCKED = null;   // 서버가 거부한 이유 (명단 미등록 · 토큰 불일치 등)
const tokenParam = () => CONFIG.ACCESS_TOKEN ? '&token=' + encodeURIComponent(CONFIG.ACCESS_TOKEN) : '';

async function syncLoad(name) {
  if (!CONFIG.SYNC_URL) return null;
  try {
    const r = await fetch(CONFIG.SYNC_URL + '?action=load&name=' + encodeURIComponent(name) + tokenParam());
    if (!r.ok) return null;
    const j = await r.json();
    if (j && j.ok === false) { SYNC_BLOCKED = j.error || '서버가 요청을 거부했습니다'; return null; }
    return j && j.ok && j.state ? j.state : null;
  } catch (e) { return null; }
}

let saveTimer = null;
function saveState() {
  if (!S) return;
  store.set(KEY(S.name), JSON.stringify(S));
  if (!CONFIG.SYNC_URL) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    // text/plain 으로 보내 CORS preflight 를 피합니다 (Apps Script 권장 방식)
    fetch(CONFIG.SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'save', name: S.name, state: S, token: CONFIG.ACCESS_TOKEN })
    }).catch(() => {});
  }, 900);
}

async function submitCheck(unitId, payload) {
  if (CONFIG.SYNC_URL) {
    const r = await fetch(CONFIG.SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'submit', name: S.name, unit: unitId, submission: payload, token: CONFIG.ACCESS_TOKEN })
    });
    const j = await r.json();
    if (!j || !j.ok) throw new Error(j && j.error ? j.error : '서버가 제출을 받지 못했습니다');
    return { via: 'server' };
  }
  // 폴백: 파일 다운로드
  const blob = new Blob([JSON.stringify({ name: S.name, unit: unitId, submission: payload }, null, 2)],
    { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `제출_${S.name}_${unitId}_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  return { via: 'download' };
}


/* ============================================================================

const AVATAR_MAP = {
  '박재국': 'dog',    '노혜영': 'sheep',  '추진주': 'chick',
  '정재현': 'hamster','손성재': 'deer',   '이용호': 'husky',

};
const AVATAR_ORDER = ['dog','sheep','chick','hamster','deer','husky','fox','panda','raccoon','tiger','koala','pig'];

/* 동물별 색과 부위 정의 */
const ANIMALS = {
  dog:     { name:'강아지', head:'#C08A5E', ear:'floppy', earFill:'#8A5334', muzzle:'#FAEFE2', nose:'#4A3A2E', tongue:true },
  sheep:   { name:'양',     head:'#EFE2D2', ear:'side',   earFill:'#D9C6B2', wool:true,  nose:'#5A4636' },
  chick:   { name:'병아리', head:'#F7CE46', ear:'none',   earFill:'#F7CE46', comb:true,  beak:'#F09134' },
  hamster: { name:'햄스터', head:'#AFB4BA', ear:'round',  earFill:'#F0C3C6', muzzle:'#C6CAD0', nose:'#4A4A4A', teeth:true },
  deer:    { name:'사슴',   head:'#E3B187', ear:'side',   earFill:'#C48F63', antler:true, nose:'#4A3A2E' },
  husky:   { name:'허스키', head:'#3E4650', ear:'pointed',earFill:'#2C333B', mask:'#FBFCFD', tongue:true, nose:'#33393F' },
  fox:     { name:'여우',   head:'#EE7B3C', ear:'pointed',earFill:'#C85A22', mask:'#FDFDFD', nose:'#4A3A2E' },
  panda:   { name:'판다',   head:'#FBFCFD', ear:'round',  earFill:'#333A42', patch:'#333A42', nose:'#333A42' },
  raccoon: { name:'라쿤',   head:'#9AA1A8', ear:'round',  earFill:'#7A8189', band:true, nose:'#3E444A' },
  tiger:   { name:'호랑이', head:'#F0A03C', ear:'round',  earFill:'#D07A22', stripe:true, muzzle:'#FDF3E6', nose:'#4A3A2E' },
  koala:   { name:'코알라', head:'#A6ADB4', ear:'big',    earFill:'#C9CED3', nose:'#4A4A4A', bigNose:true },
  pig:     { name:'돼지',   head:'#F0AEB8', ear:'pointed',earFill:'#D98A97', snout:'#E890A0', nose:'#B96A79' },
};

function animalFor(name) {
  const key = String(name || '').trim();
  if (AVATAR_MAP[key]) return AVATAR_MAP[key];
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 100000;
  return AVATAR_ORDER[h % AVATAR_ORDER.length];
}

/* 귀 모양 */
function ears(a) {
  const f = a.earFill;
  switch (a.ear) {
    case 'floppy':  return `<ellipse cx="13" cy="36" rx="10" ry="16" fill="${f}"/>
                            <ellipse cx="67" cy="36" rx="10" ry="16" fill="${f}"/>`;
    case 'pointed': return `<path d="M14 34 L20 8 L38 22 Z" fill="${f}"/>
                            <path d="M66 34 L60 8 L42 22 Z" fill="${f}"/>`;
    case 'round':   return `<circle cx="19" cy="22" r="11" fill="${f}"/>
                            <circle cx="61" cy="22" r="11" fill="${f}"/>`;
    case 'big':     return `<circle cx="14" cy="28" r="14" fill="${f}"/>
                            <circle cx="66" cy="28" r="14" fill="${f}"/>`;
    case 'side':    return `<ellipse cx="8" cy="40" rx="11" ry="6.5" fill="${f}"/>
                            <ellipse cx="72" cy="40" rx="11" ry="6.5" fill="${f}"/>`;
    default:        return '';
  }
}

function animalSvg(key, size) {
  const a = ANIMALS[key] || ANIMALS.dog;
  const S = size || 40;
  const dark = '#5A4436';
  let extra = '';

  if (a.antler) extra += `<g stroke="#8D5C3A" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M27 22 L20 4"/><path d="M22 11 L12 10"/><path d="M20 4 L25 1"/>
      <path d="M53 22 L60 4"/><path d="M58 11 L68 10"/><path d="M60 4 L55 1"/></g>`;
  if (a.comb) extra += `<path d="M40 12 q-8 -9 -2 -11 q4 -1 4 4 q3 -6 7 -3 q4 3 -1 8 Z" fill="#E8453C"/>`;

  let head = `<rect x="8" y="16" width="64" height="56" rx="26" fill="${a.head}"/>`;
  if (a.wool) head += `<g fill="#FFFFFF">
      <circle cx="26" cy="24" r="10"/><circle cx="40" cy="18" r="11"/><circle cx="54" cy="24" r="10"/>
      <circle cx="20" cy="34" r="8"/><circle cx="60" cy="34" r="8"/></g>`;
  if (a.mask) head += `<path d="M40 30 q-18 4 -18 22 q0 16 18 20 q18 -4 18 -20 q0 -18 -18 -22 Z" fill="${a.mask}"/>`;
  if (a.patch) head += `<ellipse cx="26" cy="44" rx="9" ry="10" fill="${a.patch}"/>
                        <ellipse cx="54" cy="44" rx="9" ry="10" fill="${a.patch}"/>`;
  if (a.band) head += `<path d="M13 40 q27 -9 54 0 q-5 12 -27 12 q-22 0 -27 -12 Z" fill="#3E444A"/>`;
  if (a.stripe) head += `<g stroke="#8A4A12" stroke-width="3.6" stroke-linecap="round">
      <path d="M34 20 L31 30"/><path d="M46 20 L49 30"/><path d="M14 40 L23 42"/><path d="M66 40 L57 42"/></g>`;
  if (a.muzzle) head += `<ellipse cx="40" cy="56" rx="16" ry="12" fill="${a.muzzle}"/>`;
  if (a.snout) head += `<ellipse cx="40" cy="54" rx="15" ry="11" fill="${a.snout}"/>
                        <ellipse cx="34" cy="54" rx="3" ry="4" fill="${a.nose}"/>
                        <ellipse cx="46" cy="54" rx="3" ry="4" fill="${a.nose}"/>`;

  const eyeY = a.patch ? 44 : 46;
  const onDark = !!(a.patch || a.band);
  const eyeBase = onDark
    ? `<circle cx="28" cy="${eyeY}" r="6.4" fill="#FDFDFD"/>
       <circle cx="52" cy="${eyeY}" r="6.4" fill="#FDFDFD"/>` : '';
  const eyes = eyeBase + `<circle cx="28" cy="${eyeY}" r="4.6" fill="#3A3A3A"/>
                <circle cx="52" cy="${eyeY}" r="4.6" fill="#3A3A3A"/>
                <circle cx="29.6" cy="${eyeY - 1.6}" r="1.7" fill="#fff"/>
                <circle cx="53.6" cy="${eyeY - 1.6}" r="1.7" fill="#fff"/>`;
  const cheeks = `<ellipse cx="18" cy="56" rx="5.5" ry="3.6" fill="#F2A0A6" opacity=".55"/>
                  <ellipse cx="62" cy="56" rx="5.5" ry="3.6" fill="#F2A0A6" opacity=".55"/>`;

  let face = '';
  if (a.beak) face = `<path d="M33 54 L47 54 L40 63 Z" fill="${a.beak}"/>`;
  else if (a.bigNose) face = `<ellipse cx="40" cy="56" rx="8" ry="10" fill="${a.nose}"/>`;
  else if (!a.snout) {
    face = `<ellipse cx="40" cy="55" rx="4.4" ry="3.4" fill="${a.nose}"/>
            <path d="M40 58 q-5 5 -9 1 M40 58 q5 5 9 1" stroke="${dark}" stroke-width="2.2"
                  stroke-linecap="round" fill="none"/>`;
  }
  if (a.teeth) face += `<rect x="37" y="60" width="6" height="6" rx="1.6" fill="#fff" stroke="${dark}" stroke-width="1.2"/>`;
  if (a.tongue) face += `<path d="M36 60 q4 8 8 0 Z" fill="#F0808C"/>`;

  return `<svg class="avatar" width="${S}" height="${S}" viewBox="0 0 80 80" aria-hidden="true">
    ${extra}${ears(a)}${head}${eyes}${cheeks}${face}</svg>`;
}
const animalName = key => (ANIMALS[key] || ANIMALS.dog).name;

const $ = s => document.querySelector(s);
const nl2br = s => esc(s).replace(/\n/g, '<br>');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function renderStats() {
  const rec = Object.values(S.practice);
  const got = rec.reduce((a, r) => a + r.best, 0);
  const max = rec.reduce((a, r) => a + r.max, 0);
  const acc = max ? Math.round(got / max * 100) + '%' : '—';
  $('#tbXp').textContent = S.xp;
  $('#tbStreak').textContent = S.streak;
  $('#tbAcc').textContent = acc;
  $('#stXp').textContent = S.xp;
  $('#stDone').textContent = rec.length;
  $('#stStreak').textContent = S.streak;

function renderUnitList() {
  const box = $('#unitList');
  if (!BANK.units.length) {
    box.innerHTML = '<div class="notice">단원이 비어 있습니다. questions.json 의 <b>units</b> 에 단원을 추가하세요.</div>';
    return;
  }
  box.innerHTML = BANK.units.map(u => {
    const p = practiceProgress(u.id);
    const submitted = !!S.check[u.id];
    const refl = isReflectUnit(u.id);
    const work = isWorkUnit(u.id);
    const total = refl ? reflectQs(u.id).length : work ? workQs(u.id).length : p.total;
    const empty = total === 0;
    let sub, ratio = p.ratio, done = submitted;
    if (refl) {
      const w = reflectWritten(u.id), r = reflectRound(u.id);
      ratio = total ? w / total : 0;
      done = !!S.sent[u.id];
      sub = S.sent[u.id] ? '제출 완료'
        : r >= 2 ? `${r}차까지 작성`
        : w === 0 ? '아직 안 썼어요'
        : w < total ? `작성 ${w}/${total}` : '1차 작성 완료';
    } else if (work) {
      const w = workWritten(u.id), r = workRound(u.id);
      ratio = total ? w / total : 0;
      done = !!S.sent[u.id];
      sub = S.sent[u.id] ? '제출 완료'
        : w === 0 ? '아직 기록 없음'
        : w < total ? `기록 ${w}/${total}`
        : r >= 2 ? `${r}차까지 기록` : '4개 모두 기록';
    } else {
      sub = empty ? '문항 준비 중'
        : submitted ? '체크 제출 완료'
        : checkUnlocked(u.id) ? '체크 모드 열림'
        : `연습 ${p.done}/${p.total}`;
    }
    return `<button class="unit-btn" data-unit="${esc(u.id)}" style="--u:${esc(u.color || '#1B3A6B')}"
        aria-current="${CUR_UNIT === u.id}" ${empty ? 'disabled' : ''}>
      <div class="row">
        <span class="ic">${esc(u.icon || '•')}</span>
        <span class="nm">${esc(u.title)}</span>
        <span class="qn mono">${total || 0}</span>
      </div>
      <div class="sub">${esc(sub)}</div>
      <div class="bar ${done ? 'done' : ''}"><i style="width:${Math.round(ratio * 100)}%"></i></div>
    </button>`;
  }).join('');
  box.querySelectorAll('[data-unit]').forEach(b =>
    b.addEventListener('click', () => openUnit(b.dataset.unit)));
}

            <li>몇 번이든 다시 풀 수 있어요</li>

          </button>
        </div>

        <div class="mode-card check">
          <span class="eyebrow">체크 모드</span>
          <h3>제출하기</h3>

          </ul>
          ${submitted
            ? `<div class="lock-why mono">제출 ${esc(submitted.submittedAt.slice(0, 16).replace('T', ' '))}</div>
               <button class="btn quiet" id="btnCheckDone">제출 내용 보기</button>`
            : !checkQs.length
              ? `<div class="lock-why mono">체크 문항 준비 중</div><button class="btn" disabled>대기</button>`
              : unlocked
                ? `<button class="btn amber" id="btnCheck">체크 시작 (${checkQs.length}문항)</button>`
                : `<div class="lock-why mono">연습 ${Math.round(CONFIG.UNLOCK_RATIO * 100)}% 이상 완료 시 열립니다</div>
                   <button class="btn" disabled>잠김</button>`}
        </div>

  const bp = $('#btnPractice');

      startRun(unitId, 'check');
  });
  const bd = $('#btnCheckDone');
  if (bd) bd.addEventListener('click', () => showCheckResult(unitId));
}

/* ============================================================================
   8. 세션 실행
   ========================================================================== */
function startRun(unitId, mode, customQueue) {
  let queue = customQueue || qOfUnit(unitId, mode);
  if (mode === 'practice' && !customQueue) {
    const p = practiceProgress(unitId);
    // 다 풀었으면 전체, 아니면 안 푼 것부터
    if (p.ratio < 1) queue = queue.filter(q => !S.practice[q.id]);
  }
  if (!queue.length) { toast('풀 문항이 없습니다'); return; }

  RUN = {
    unitId, mode, queue, i: 0,
    hearts: mode === 'practice' ? CONFIG.HEARTS : 0,
    answers: {}, startedAt: Date.now(), locked: false, hintOpen: false
  };
  renderQuestion();
}

function renderQuestion() {
  const q = RUN.queue[RUN.i];
  const isCheck = RUN.mode === 'check';
  const u = BANK.units.find(x => x.id === RUN.unitId);

  $('#stage').innerHTML = `
    <div class="runner ${isCheck ? 'check-mode' : ''}" style="--u:${esc(u.color || '#1B3A6B')}">
      <div class="runner-bar">
        <span class="mode-tag ${isCheck ? '' : 'prac'}">${isCheck ? '평가' : '연습'}</span>
        <span class="pos mono">${RUN.i + 1} / ${RUN.queue.length}</span>
        <span class="spacer"></span>
        ${!isCheck && CONFIG.HEARTS
          ? `<span class="hearts">${'❤️'.repeat(Math.max(RUN.hearts, 0))}${'🖤'.repeat(Math.max(CONFIG.HEARTS - RUN.hearts, 0))}</span>`
          : `<span class="pos mono">${esc(u.title)}</span>`}
        <button class="ghost-btn" style="border-color:var(--line-2);color:var(--muted)" id="exitBtn">
          ${isCheck ? '중단' : '나가기'}
        </button>
      </div>
      <div class="runner-body" id="qBody"></div>
    </div>`;
  $('#exitBtn').addEventListener('click', () => {
    if (isCheck && !confirm('지금 나가면 남은 문항은 미응답으로 제출됩니다. 나갈까요?')) return;
    if (isCheck) { finishRun(); return; }
    openUnit(RUN.unitId);
  });

  const body = $('#qBody');
  body.innerHTML = `
    <span class="eyebrow q-type">${TYPE_LABEL[q.type]}${q.maxScore ? ' · 배점 ' + q.maxScore : ''}</span>
    ${q.context ? `<div class="q-context">${esc(q.context)}</div>` : ''}
    <p class="q-prompt">${esc(q.prompt)}</p>
    <div id="qInput"></div>
    <div id="qFeedback"></div>
    <div class="foot" id="qFoot"></div>`;

  const input = $('#qInput');
  if (CHOICE_TYPES.includes(q.type)) renderChoices(q, input);
  else if (q.type === 'number') renderNumber(q, input);
  else renderFree(q, input);
}

/* ---- 선택형 ---- */
function renderChoices(q, box) {
  const keys = 'ABCDEFGH';
  box.innerHTML = `<div class="choices">` + q.choices.map((c, i) =>
    `<button class="choice" data-i="${i}">
       <span class="key mono">${keys[i]}</span>
       <span class="txt">${esc(c.text)}</span>
     </button>`).join('') + `</div>`;
  box.querySelectorAll('.choice').forEach(b =>
    b.addEventListener('click', () => answerChoice(q, Number(b.dataset.i))));
}

function answerChoice(q, idx) {
  if (RUN.locked) return;
  RUN.locked = true;
  const score = Number(q.choices[idx].score) || 0;
  RUN.answers[q.id] = { type: q.type, choice: idx, score, max: q.maxScore };
  document.querySelectorAll('#qInput .choice').forEach((el, i) => {
    el.disabled = true;
    if (i === idx) el.dataset.picked = 'true';
  });
  if (RUN.mode === 'check') { commitAuto(q, score); nextFoot(); return; }

  // 연습: 점수 칩 + 해설 + 스펙트럼 공개
  document.querySelectorAll('#qInput .choice').forEach((el, i) => {
    const c = q.choices[i];
    const v = Number(c.score) || 0;
    const tone = v === q.maxScore ? 3 : Math.min(v, 2);   // 만점은 항상 초록
    el.insertAdjacentHTML('afterbegin', `<span class="score-chip sc-${tone}">${v}</span>`);
    if (v === q.maxScore) el.classList.add('best');
    else if (i === idx) el.classList.add('miss');
    if (c.why) el.querySelector('.txt').insertAdjacentHTML('beforeend',
      `<div class="why">${esc(c.why)}</div>`);
  });
  commitAuto(q, score);
  if (q.type === 'situation') renderSpectrum(q, idx);
  else {
    const ok = score >= q.maxScore;
    $('#qFeedback').innerHTML =
      `<div class="notice ${ok ? 'good' : 'bad'}" style="margin-top:18px">
         ${ok ? '<b>정답입니다.</b>' : '<b>다시 볼 문항이에요.</b> 복습함에 담았어요.'}
         ${q.explain ? ' ' + esc(q.explain) : ''}
       </div>`;
  }
  nextFoot();
}

/* ---- 시그니처: 판단 스펙트럼 ---- */
function renderSpectrum(q, idx) {
  const mine = Number(q.choices[idx].score) || 0;
  const max = q.maxScore;
  const bestIdx = q.choices.findIndex(c => Number(c.score) === max);
  const pos = v => (max ? (v / max) * 100 : 0);
  const same = mine === max;

  const gap = same
    ? `<b>최선의 판단입니다.</b> ${esc(q.choices[bestIdx].why || '')}`
    : `내 답은 <b>${mine}점</b>, 최선은 <b>${max}점</b>입니다. ${
        esc(q.gapNote || q.choices[bestIdx].why || '최선 선택지의 해설을 확인해 주세요.')}`;

  $('#qFeedback').innerHTML = `
    <div class="spectrum">
      <span class="eyebrow">판단 스펙트럼 · 0점에서 ${max}점까지</span>
      <div class="spec-track"><div class="spec-inner">
        <div class="spec-rail"></div>
        ${same ? '' : `<div class="spec-mark best" style="left:${pos(max)}%">
          <div class="dot"></div><span class="lb">최선 ${max}</span></div>`}
        <div class="spec-mark me" style="left:${pos(mine)}%">
          <div class="dot"></div><span class="lb">내 답 ${mine}</span></div>
      </div></div>
      <div class="spec-gap">${gap}</div>
      ${q.explain ? `<div class="notice" style="margin-top:10px">${esc(q.explain)}</div>` : ''}
    </div>`;
}

/* ---- 숫자형 ---- */
function renderNumber(q, box) {
  box.innerHTML = `
    <div class="num-row">
      <input id="numIn" type="text" inputmode="decimal" placeholder="숫자만" autocomplete="off">
      ${q.unitLabel ? `<span class="unit-label">${esc(q.unitLabel)}</span>` : ''}
      <button class="btn sm" id="numSubmit" style="margin-top:0">확인</button>
    </div>
    ${q.hint && RUN.mode === 'practice'
      ? `<button class="hint-btn" id="hintBtn">계산 힌트 보기</button><div id="hintBox"></div>` : ''}`;
  const send = () => answerNumber(q);
  $('#numSubmit').addEventListener('click', send);
  $('#numIn').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  $('#numIn').focus();
  const hb = $('#hintBtn');
  if (hb) hb.addEventListener('click', () => {
    $('#hintBox').innerHTML = `<div class="hint-box">${esc(q.hint)}</div>`;
    hb.remove();
  });
}

function answerNumber(q) {
  if (RUN.locked) return;
  const raw = $('#numIn').value.replace(/,/g, '').trim();
  const val = parseFloat(raw);
  if (raw === '' || isNaN(val)) { toast('숫자를 입력해 주세요'); return; }
  RUN.locked = true;
  const ok = Math.abs(val - q.accept.value) <= q.accept.tolerance;
  const score = ok ? q.maxScore : 0;
  RUN.answers[q.id] = { type: 'number', value: val, score, max: q.maxScore };
  $('#numIn').disabled = true; $('#numSubmit').disabled = true;
  commitAuto(q, score);

  if (RUN.mode === 'practice') {
    $('#qFeedback').innerHTML = `
      <div class="notice ${ok ? 'good' : 'bad'}" style="margin-top:16px">
        ${ok ? '<b>맞았습니다.</b>' : `<b>정답은 ${q.accept.value}${q.unitLabel ? ' ' + esc(q.unitLabel) : ''} 입니다.</b>`}
        ${q.explain ? ' ' + esc(q.explain) : ''}
      </div>`;
  }
  nextFoot();
}

/* ---- 서술 / 미션 ---- */
function renderFree(q, box) {
  box.innerHTML = `
    <textarea class="free-input" id="freeIn" placeholder="여기에 작성하세요"></textarea>
    <div class="counter mono" id="cnt">0자</div>
    ${Array.isArray(q.rubric) && q.rubric.length ? `
      <div class="rubric">
        <span class="eyebrow">채점 기준</span>
        <ul>${q.rubric.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      </div>` : ''}
    <div class="notice" style="margin-top:12px">이 문항은 자동 채점되지 않고 평가자가 직접 읽습니다.</div>`;
  const ta = $('#freeIn');
  ta.addEventListener('input', () => {
    $('#cnt').textContent = ta.value.trim().length + '자';
  });
  nextFoot(true);
}

function submitFree(q) {
  const ta = $('#freeIn');
  const text = ta.value.trim();
  if (text.length < CONFIG.MIN_CHARS) {
    toast(`${CONFIG.MIN_CHARS}자 이상 작성해 주세요 (현재 ${text.length}자)`);
    return false;
  }
  RUN.answers[q.id] = { type: q.type, text, score: null, max: q.maxScore };
  if (RUN.mode === 'practice') {
    S.practice[q.id] = S.practice[q.id] || { best: 0, max: 0, tries: 0 };
    S.practice[q.id].tries++;
    bumpStreak(); saveState(); renderStats(); renderUnitList();
  }
  return true;
}

/* ---- 자동 채점 문항 반영 ---- */
function commitAuto(q, score) {
  if (RUN.mode !== 'practice') return;
  const prev = S.practice[q.id];
  const gained = Math.max(0, score - (prev ? prev.best : 0));
  S.practice[q.id] = {
    best: Math.max(score, prev ? prev.best : 0),
    max: q.maxScore,
    tries: (prev ? prev.tries : 0) + 1
  };
  S.xp += gained * CONFIG.XP_PER_POINT;
  if (score < q.maxScore) {
    if (!S.review.includes(q.id)) S.review.push(q.id);
    if (CONFIG.HEARTS) RUN.hearts--;
  } else {
    S.review = S.review.filter(x => x !== q.id);
  }
  bumpStreak();
  saveState();
  renderStats();
  renderUnitList();
}

/* ---- 다음 버튼 ---- */
function nextFoot(freeMode) {
  const q = RUN.queue[RUN.i];
  const last = RUN.i === RUN.queue.length - 1;
  const outOfHearts = RUN.mode === 'practice' && CONFIG.HEARTS && RUN.hearts <= 0;
  const foot = $('#qFoot');

  if (freeMode) {
    foot.innerHTML = `<span class="note">최소 ${CONFIG.MIN_CHARS}자</span>
      <span class="spacer"></span>
      <button class="btn sm" id="nextBtn" style="margin-top:0">${last ? '마치기' : '다음 문항'}</button>`;
    $('#nextBtn').addEventListener('click', () => { if (submitFree(q)) advance(); });
    return;
  }
  if (outOfHearts) {
    foot.innerHTML = `<span class="note">하트를 모두 썼어요. 해설을 확인하고 다시 시작해 보세요.</span>
      <span class="spacer"></span>
      <button class="btn sm" id="nextBtn" style="margin-top:0">단원으로</button>`;
    $('#nextBtn').addEventListener('click', () => openUnit(RUN.unitId));
    return;
  }
  foot.innerHTML = `<span class="spacer"></span>
    <button class="btn sm" id="nextBtn" style="margin-top:0">${last ? '마치기' : '다음 문항'}</button>`;
  $('#nextBtn').addEventListener('click', advance);
}

function advance() {
  if (RUN.i === RUN.queue.length - 1) { finishRun(); return; }
  RUN.i++; RUN.locked = false;
  renderQuestion();
}

/* ============================================================================
   9. 세션 종료
   ========================================================================== */
async function finishRun() {
  const { unitId, mode, queue, answers, startedAt } = RUN;
  const elapsed = Math.round((Date.now() - startedAt) / 1000);
  const u = BANK.units.find(x => x.id === unitId);

  if (mode === 'practice') {
    const got = queue.reduce((a, q) => a + (answers[q.id]?.score || 0), 0);
    const max = queue.filter(isAuto).reduce((a, q) => a + q.maxScore, 0);
    RUN = null;
    $('#stage').innerHTML = `
      <div class="panel done-wrap unit-panel" style="--u:${esc(u.color || '#1B3A6B')}">
        <span class="eyebrow tinted">연습 완료 · ${esc(u.title)}</span>
        <h2>${max && got / max >= .8 ? '체크 모드에 들어갈 준비가 됐어요' : '한 번 더 돌려볼까요'}</h2>
        <p class="lead">연습 결과는 평가에 반영되지 않아요.</p>
        <div class="kv">
          <div><div class="v mono">${got} / ${max}</div><div class="k">획득 점수</div></div>
          <div><div class="v mono">${fmtTime(elapsed)}</div><div class="k">소요 시간</div></div>
        </div>
        ${renderTagProfile(queue, answers)}
        <div class="foot">
          <button class="btn quiet sm" id="againBtn" style="margin-top:0">다시 풀기</button>
          <span class="spacer"></span>
          <button class="btn sm" id="backBtn" style="margin-top:0">단원으로</button>
        </div>
      </div>`;
    $('#againBtn').addEventListener('click', () => startRun(unitId, 'practice', qOfUnit(unitId, 'practice')));
    $('#backBtn').addEventListener('click', () => openUnit(unitId));
    return;
  }

  // ---- 체크 모드 제출 ----
  const items = queue.map(q => {
    const a = answers[q.id] || null;
    return {
      id: q.id, type: q.type, tags: q.tags, maxScore: q.maxScore,
      answered: !!a,
      choice: a && 'choice' in a ? a.choice : null,
      value: a && 'value' in a ? a.value : null,
      text: a && 'text' in a ? a.text : null,
      score: a && typeof a.score === 'number' ? a.score : null
    };
  });
  const autoQ = queue.filter(isAuto);
  const payload = {
    unit: unitId, unitTitle: u.title, bankVersion: BANK.version,
    submittedAt: new Date().toISOString(), elapsedSec: elapsed,
    auto: {
      got: autoQ.reduce((a, q) => a + (answers[q.id]?.score || 0), 0),
      max: autoQ.reduce((a, q) => a + q.maxScore, 0)
    },
    manualCount: queue.length - autoQ.length,
    tagScores: tagAgg(queue, answers),
    items
  };

  $('#stage').innerHTML = `<div class="panel"><div class="empty">
    <span class="ic">⏳</span><p>제출하고 있어요</p></div></div>`;

  let via = 'local';
  try {
    const r = await submitCheck(unitId, payload);
    via = r.via;
  } catch (e) {
    $('#stage').innerHTML = `
      <div class="panel">
        <div class="notice bad"><b>제출에 실패했습니다.</b> ${esc(e.message)}</div>
        <div class="notice" style="margin-top:10px">답안은 이 브라우저에 남아 있습니다. 아래 버튼으로 파일을 내려 담당자에게 전달해 주세요.</div>
        <div class="foot"><button class="btn sm" id="dlBtn" style="margin-top:0">답안 파일 내려받기</button></div>
      </div>`;
    $('#dlBtn').addEventListener('click', async () => {
      CONFIG.SYNC_URL = ''; await submitCheck(unitId, payload); toast('파일을 내려받았습니다');
    });
    S.check[unitId] = payload; saveState();
    RUN = null; renderUnitList();
    return;
  }

  S.check[unitId] = payload;
  bumpStreak(); saveState(); renderStats(); renderUnitList();
  RUN = null;

  $('#stage').innerHTML = `
    <div class="panel done-wrap">
      <span class="eyebrow">체크 제출 완료 · ${esc(u.title)}</span>
      <h2>제출됐습니다</h2>
      <p class="lead">점수는 공개되지 않아요. 평가자가 확인한 뒤 면접에서 함께 이야기합니다.</p>
      <div class="kv">
        <div><div class="v mono">${items.filter(i => i.answered).length} / ${items.length}</div><div class="k">응답 문항</div></div>
        <div><div class="v mono">${fmtTime(elapsed)}</div><div class="k">소요 시간</div></div>
      </div>
      ${via === 'download'
        ? `<div class="notice warn"><b>서버가 연결되지 않아 파일로 내려받았습니다.</b> 내려받은 JSON 파일을 담당자에게 전달해 주세요.</div>`
        : `<div class="notice">답안이 서버에 기록됐습니다.</div>`}
      <div class="foot">
        <span class="spacer"></span>
        <button class="btn sm" id="backBtn" style="margin-top:0">단원 목록으로</button>
      </div>
    </div>`;
  $('#backBtn').addEventListener('click', () => openUnit(unitId));
}

function showCheckResult(unitId) {
  const c = S.check[unitId];
  const u = BANK.units.find(x => x.id === unitId);
  $('#stage').innerHTML = `
    <div class="panel done-wrap">
      <span class="eyebrow">제출 기록 · ${esc(u.title)}</span>
      <h2>이미 제출한 단원입니다</h2>
      <p class="lead">체크 모드는 재응시할 수 없어요. 연습 모드는 계속 열려 있습니다.</p>
      <div class="kv">
        <div><div class="v mono">${c.items.filter(i => i.answered).length} / ${c.items.length}</div><div class="k">응답 문항</div></div>
        <div><div class="v mono">${fmtTime(c.elapsedSec)}</div><div class="k">소요 시간</div></div>
      </div>
      <div class="notice">제출 시각 ${esc(c.submittedAt.slice(0, 16).replace('T', ' '))}</div>
      <div class="foot"><span class="spacer"></span>
        <button class="btn sm" id="backBtn" style="margin-top:0">단원으로</button></div>
    </div>`;
